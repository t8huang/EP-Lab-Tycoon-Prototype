<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EP Lab Tycoon — control panel</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ep-font:"Hanken Grotesk",ui-rounded,"Segoe UI",system-ui,sans-serif;
    --ep-page:#e9e7df; --ep-card:#ffffff; --ep-soft:#f5f4ef; --ep-inset:#f0eee7;
    --ep-line:rgba(20,20,18,.12); --ep-line2:rgba(20,20,18,.22);
    --ep-text:#232320; --ep-text2:#57564f; --ep-text3:#86857b;
    --ep-accent:#0f6e56; --ep-accent-bg:#e1f5ee; --ep-accent-line:#5dcaa5;
    --ep-good:#2f7d32; --ep-good-bg:#e6f4e2;
    --ep-warn:#9a6206; --ep-warn-bg:#fbefd8;
    --ep-bad:#b23030; --ep-bad-bg:#fbe7e7;
    --ep-blue:#175fa6; --ep-blue-bg:#e4f0fb;
    /* chart tokens — the three status colours you asked for */
    --c-ideal:#e3a71f; --c-good:#2f9e44; --c-bad:#e03131;
    --s-proc:#175fa6; --s-idle:#e2e0d8;
    --r:12px;
  }
  @media (prefers-color-scheme:dark){:root{
    --ep-page:#151513; --ep-card:#242422; --ep-soft:#201f1d; --ep-inset:#1b1b19;
    --ep-line:rgba(255,255,255,.12); --ep-line2:rgba(255,255,255,.24);
    --ep-text:#f4f2ec; --ep-text2:#bcbab0; --ep-text3:#8c8b81;
    --ep-accent:#5dcaa5; --ep-accent-bg:#0d3a30; --ep-accent-line:#0f6e56;
    --ep-good:#8fd06a; --ep-good-bg:#1e3a10;
    --ep-warn:#efb44a; --ep-warn-bg:#3a2606;
    --ep-bad:#f28b8b; --ep-bad-bg:#401717;
    --ep-blue:#7fb4ea; --ep-blue-bg:#0c2a45;
    --c-ideal:#f0c04a; --c-good:#5fc46b; --c-bad:#ef6b6b;
    --s-proc:#378add; --s-idle:#2d2d2a;
  }}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--ep-card);color:var(--ep-text);font-family:var(--ep-font);
       -webkit-font-smoothing:antialiased;padding:0;line-height:1.45}
  .ept{width:100%;margin:0}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
  .frame{background:var(--ep-card);min-height:100vh;overflow:hidden}

  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 32px;
       border-bottom:1px solid var(--ep-line);background:var(--ep-soft);flex-wrap:wrap;
       position:sticky;top:0;z-index:20}
  .brand{display:flex;align-items:center;gap:11px;font-weight:700;font-size:19px;letter-spacing:-.01em}
  .logo{width:34px;height:34px;border-radius:10px;background:var(--ep-accent);color:#fff;
        display:flex;align-items:center;justify-content:center;font-size:20px}
  @media (prefers-color-scheme:dark){.logo{color:#04241c}}
  .tabs{display:flex;gap:5px;background:var(--ep-inset);padding:4px;border-radius:999px}
  .tab{font:inherit;font-size:13.5px;font-weight:600;padding:7px 15px;border-radius:999px;cursor:pointer;
       border:0;background:transparent;color:var(--ep-text2);display:inline-flex;align-items:center;gap:6px}
  .tab.on{background:var(--ep-card);color:var(--ep-accent);box-shadow:0 1px 2px rgba(20,20,18,.12)}

  /* clock bar */
  .clockbar{display:flex;align-items:center;gap:14px;padding:14px 32px;border-bottom:1px solid var(--ep-line);
            background:var(--ep-card);flex-wrap:wrap}
  .clockface{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;min-width:138px;letter-spacing:-.02em}
  .clockface.late{color:var(--ep-warn)}
  .tadv{display:inline-flex;gap:0;background:var(--ep-inset);border-radius:11px;padding:3px}
  .tadv .tbtn{border:0;background:transparent;border-radius:8px;padding:8px 15px;color:var(--ep-text2);font-weight:700}
  .tbtn{font:inherit;font-size:13.5px;font-weight:600;padding:8px 13px;border-radius:10px;cursor:pointer;
        border:1px solid var(--ep-line2);background:var(--ep-card);color:var(--ep-text2);display:inline-flex;align-items:center;gap:5px;
        transition:background .12s,color .12s}
  .tadv .tbtn:hover{background:var(--ep-card);color:var(--ep-accent);box-shadow:0 1px 2px rgba(20,20,18,.1)}
  .tbtn:hover{border-color:var(--ep-accent);color:var(--ep-accent)}
  .tbtn.on{background:var(--ep-accent-bg);border-color:var(--ep-accent);color:var(--ep-accent)}
  .tbtn.ghost{color:var(--ep-text3);font-weight:600}
  .tbtn.ghost:hover{color:var(--ep-accent)}
  .grow{flex:1}

  /* youtube-style scrubber */
  .scrub{display:flex;align-items:center;gap:16px;padding:12px 32px 18px;border-bottom:1px solid var(--ep-line);background:var(--ep-card)}
  .pbtn{width:46px;height:46px;border-radius:50%;border:0;background:var(--ep-accent);color:#fff;font-size:22px;
        cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none}
  @media (prefers-color-scheme:dark){.pbtn{color:#04241c}}
  .pbtn:hover{filter:brightness(1.06)}
  .ptime{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ep-text3);flex:none}
  .ptime.cur{color:var(--ep-text);font-size:15.5px;min-width:96px}
  .track{position:relative;flex:1;height:9px;border-radius:999px;background:var(--ep-inset);cursor:pointer;touch-action:none}
  .track .buf{position:absolute;left:0;top:0;height:100%;border-radius:999px;background:var(--ep-line2);opacity:.55}
  .track .prog{position:absolute;left:0;top:0;height:100%;border-radius:999px;background:var(--ep-accent)}
  .track .thumb{position:absolute;top:50%;width:18px;height:18px;border-radius:50%;background:var(--ep-accent);
        border:3px solid var(--ep-card);transform:translate(-50%,-50%);box-shadow:0 1px 4px rgba(0,0,0,.3);
        transition:width .12s ease,height .12s ease}
  .track:hover .thumb,.thumb:hover{width:26px;height:26px}
  .track:active .thumb{width:28px;height:28px}
  .review{display:flex;align-items:center;gap:10px;padding:11px 32px;background:var(--ep-warn-bg);color:var(--ep-warn);
          font-weight:700;font-size:13.5px;border-bottom:1px solid var(--ep-line)}
  .review .tbtn{margin-left:auto;background:var(--ep-card)}
  .reviewing .cact,.reviewing .pm,.reviewing .rooms,.reviewing .equip .toggle,.reviewing .pips{opacity:.45;pointer-events:none}
  /* speed dial */
  .speed{display:flex;align-items:center;gap:8px;flex:none}
  .slab{font-size:12.5px;font-weight:700;color:var(--ep-text3)}
  .sval{font-size:13.5px;font-weight:700;color:var(--ep-text2);min-width:34px;text-align:right;font-variant-numeric:tabular-nums}
  #speed{-webkit-appearance:none;appearance:none;width:104px;height:6px;border-radius:999px;background:var(--ep-inset);cursor:pointer}
  #speed::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:17px;height:17px;border-radius:50%;
    background:var(--ep-accent);border:3px solid var(--ep-card);box-shadow:0 1px 3px rgba(0,0,0,.28);cursor:grab}
  #speed::-moz-range-thumb{width:17px;height:17px;border-radius:50%;background:var(--ep-accent);border:3px solid var(--ep-card);cursor:grab}

  /* HUD */
  .hud{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;padding:20px 32px 6px}
  .met{background:var(--ep-soft);border:1px solid var(--ep-line);border-radius:14px;padding:13px 15px;position:relative;overflow:hidden}
  .met::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--ep-line2)}
  .met.good::before{background:var(--c-good)} .met.warn::before{background:var(--c-ideal)} .met.bad::before{background:var(--c-bad)}
  .met .k{font-size:12.5px;color:var(--ep-text2);font-weight:600;display:flex;align-items:center;gap:6px}
  .met .v{font-size:30px;font-weight:700;margin-top:3px;line-height:1.05;letter-spacing:-.02em}
  .met .u{font-size:14px;color:var(--ep-text3);font-weight:500}
  .v.good{color:var(--c-good)} .v.warn{color:var(--ep-warn)} .v.bad{color:var(--c-bad)}

  /* dashboard grid */
  .dash{display:grid;grid-template-columns:1fr;gap:18px;padding:18px 32px 30px}
  @media(min-width:900px){.dash{grid-template-columns:300px minmax(0,1fr) 340px}}
  @media(min-width:900px) and (max-width:1180px){.dash{grid-template-columns:280px minmax(0,1fr)}
    .col-right{grid-column:1 / -1}}
  .card{background:var(--ep-card);border:1px solid var(--ep-line);border-radius:16px;padding:15px 16px}
  .card + .card{margin-top:14px}
  .ctitle{font-size:13px;font-weight:700;letter-spacing:.02em;color:var(--ep-text);margin:0 0 12px;
          display:flex;align-items:center;gap:8px}
  .ctitle i{color:var(--ep-accent);font-size:17px}
  .ctitle .sub{margin-left:auto;font-size:11.5px;font-weight:500;color:var(--ep-text3);letter-spacing:0}

  /* resource pips (live availability + setup) */
  .resrow{padding:11px 0;border-top:1px solid var(--ep-line)}
  .resrow:first-of-type{border-top:0}
  .rhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px}
  .rname{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
  .rname i{color:var(--ep-accent);font-size:18px;width:20px;text-align:center}
  .rcount{font-size:13px;font-weight:700;color:var(--ep-text2);font-variant-numeric:tabular-nums}
  .rcount .out{color:var(--c-bad)}
  .pipwrap{display:flex;align-items:center;gap:8px}
  .pips{display:flex;flex-wrap:wrap;gap:4px;flex:1}
  .pip{width:26px;height:26px;border-radius:8px;border:1px solid var(--ep-line2);background:var(--ep-inset);
       color:var(--ep-text3);display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;padding:0}
  .pip.on{background:var(--ep-accent);border-color:var(--ep-accent);color:#fff}
  @media (prefers-color-scheme:dark){.pip.on{color:#04241c}}
  .pip.out{background:var(--ep-bad-bg);border-color:var(--ep-bad);color:var(--ep-bad)}
  .pip.busy{background:var(--ep-blue);border-color:var(--ep-blue);color:#fff}
  @media (prefers-color-scheme:dark){.pip.busy{color:#04241c}}
  .pm{display:flex;gap:3px}
  .pm button{font:inherit;width:26px;height:26px;border-radius:8px;cursor:pointer;border:1px solid var(--ep-line2);
       background:var(--ep-card);color:var(--ep-text);font-size:16px;line-height:1}
  .pm button:hover:not(:disabled){border-color:var(--ep-accent);color:var(--ep-accent)}
  .pm button:disabled{opacity:.3;cursor:not-allowed}

  /* rooms + equipment */
  .rooms{display:flex;flex-wrap:wrap;gap:6px}
  .rchip{font:inherit;font-size:12.5px;font-weight:600;padding:7px 11px;border-radius:9px;cursor:pointer;
         border:1px solid var(--ep-line2);background:var(--ep-good-bg);color:var(--ep-good);display:inline-flex;align-items:center;gap:5px}
  .rchip.closed{background:var(--ep-inset);color:var(--ep-text3)}
  .rchip.busy{background:var(--ep-blue-bg);color:var(--ep-blue);cursor:default}
  .equip{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--ep-line)}
  .equip:first-of-type{border-top:0}
  .equip .en{font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:8px}
  .equip .en i{color:var(--ep-text2);font-size:17px;width:20px;text-align:center}
  .toggle{font:inherit;font-size:12.5px;font-weight:700;padding:6px 13px;border-radius:999px;cursor:pointer;
          border:1px solid transparent;background:var(--ep-good-bg);color:var(--ep-good);min-width:92px;display:inline-flex;align-items:center;gap:5px;justify-content:center}
  .toggle.down{background:var(--ep-bad-bg);color:var(--ep-bad)}

  /* usage bar */
  .bar{height:12px;border-radius:999px;background:var(--ep-inset);overflow:hidden;display:flex}
  .bar .fill{background:var(--ep-accent);height:100%}
  .bar .fill.warn{background:var(--c-ideal)} .bar .fill.bad{background:var(--c-bad)}
  .barlab{display:flex;justify-content:space-between;font-size:12px;color:var(--ep-text2);margin-bottom:5px;font-weight:600}

  /* pace chart */
  .chart{width:100%;height:auto;display:block}
  .clegend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;font-weight:600;color:var(--ep-text2);margin-top:8px}
  .key{display:inline-flex;align-items:center;gap:6px}
  .kln{width:16px;height:0;border-top:3px solid}
  .kln.ideal{border-top-style:dashed;border-color:var(--c-ideal)}
  .kln.good{border-color:var(--c-good)} .kln.bad{border-color:var(--c-bad)}
  .status{font-size:14px;font-weight:700;margin-top:10px;padding:9px 12px;border-radius:10px;display:flex;align-items:center;gap:8px}
  .status.good{background:var(--ep-good-bg);color:var(--c-good)}
  .status.bad{background:var(--ep-bad-bg);color:var(--c-bad)}

  /* case flow stacked bar */
  .flow{display:flex;height:26px;border-radius:8px;overflow:hidden;border:1px solid var(--ep-line)}
  .flseg{display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;color:#fff;min-width:0}
  @media (prefers-color-scheme:dark){.flseg{color:#0c0c0a}}
  .flkey{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;font-weight:600;color:var(--ep-text2);margin-top:8px}
  .flkey .sw{width:11px;height:11px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}

  /* cases */
  .cgrp{margin-bottom:14px}
  .cgrp:last-child{margin-bottom:0}
  .cglab{font-size:12px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--ep-text2);
         margin:0 0 8px;display:flex;align-items:center;gap:7px}
  .cglab .n{background:var(--ep-inset);color:var(--ep-text2);border-radius:999px;padding:0 8px;font-size:11.5px}
  .case{display:flex;align-items:center;gap:12px;padding:11px 13px;border:1px solid var(--ep-line);
        border-left-width:4px;border-radius:12px;margin-bottom:8px;background:var(--ep-card)}
  .case.procedure{border-left-color:var(--s-proc)}
  .case.blocked{border-left-color:var(--c-bad);background:var(--ep-bad-bg)}
  .case.recovery{border-left-color:var(--ep-accent);background:var(--ep-accent-bg)}
  .case.booked{border-left-color:var(--ep-line2)}
  .case.done{opacity:.6;border-left-color:var(--ep-good)}
  .cmain{flex:1;min-width:0}
  .cname{font-size:15.5px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap;letter-spacing:-.01em}
  .badge{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--ep-inset);color:var(--ep-text2);text-transform:uppercase;letter-spacing:.03em}
  .badge.inp{background:var(--ep-blue-bg);color:var(--ep-blue)}
  .badge.compl{background:var(--ep-bad-bg);color:var(--ep-bad)}
  .csub{font-size:12.5px;color:var(--ep-text2);margin-top:2px}
  .cact{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
  .mini{font:inherit;font-size:13px;font-weight:600;padding:8px 13px;border-radius:10px;cursor:pointer;
        border:1px solid var(--ep-line2);background:var(--ep-card);color:var(--ep-text);display:inline-flex;align-items:center;gap:5px}
  .mini:hover:not(:disabled){border-color:var(--ep-accent);color:var(--ep-accent)}
  .mini.primary{background:var(--ep-accent);border-color:var(--ep-accent);color:#fff}
  @media (prefers-color-scheme:dark){.mini.primary{color:#04241c}}
  .mini.warn{color:var(--ep-warn)} .mini.warn:hover:not(:disabled){border-color:var(--ep-warn)}
  .mini.icon{padding:8px 10px;color:var(--ep-text3)}
  .mini:disabled{opacity:.4;cursor:not-allowed}
  .why{font-size:11.5px;font-weight:600;color:var(--ep-bad);text-align:right;max-width:130px;display:flex;align-items:center;gap:4px}

  /* activity feed — chat-style, like a messaging thread */
  .col-right .card{position:sticky;top:88px}
  .chat{display:flex;flex-direction:column;gap:3px;max-height:66vh;overflow-y:auto;padding-right:2px}
  .msg{display:flex;gap:9px;align-items:flex-start;margin-bottom:11px;animation:slide .22s ease-out}
  @keyframes slide{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .msg .av{width:30px;height:30px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
           font-size:15px;background:var(--ep-inset);color:var(--ep-text2)}
  .msg .bcol{min-width:0;display:flex;flex-direction:column;align-items:flex-start}
  .msg .bubble{background:var(--ep-inset);color:var(--ep-text);border-radius:4px 16px 16px 16px;padding:9px 13px;
               font-size:14px;font-weight:500;line-height:1.35;max-width:100%}
  .msg .stamp{font-size:11px;color:var(--ep-text3);font-weight:600;margin:4px 0 0 4px;font-variant-numeric:tabular-nums}
  .msg.block .av,.msg.complication .av{background:var(--ep-bad-bg);color:var(--ep-bad)}
  .msg.block .bubble,.msg.complication .bubble{background:var(--ep-bad-bg);color:var(--ep-bad)}
  .msg.discharge .av{background:var(--ep-good-bg);color:var(--ep-good)}
  .msg.discharge .bubble{background:var(--ep-good-bg);color:var(--ep-good)}
  .msg.cancel .av{background:var(--ep-warn-bg);color:var(--ep-warn)}
  .msg.cancel .bubble{background:var(--ep-warn-bg);color:var(--ep-warn)}
  .msg.start .av{background:var(--ep-blue-bg);color:var(--ep-blue)}
  .msg.start .bubble{background:var(--ep-blue-bg);color:var(--ep-blue)}
  .empty{font-size:13px;color:var(--ep-text3);padding:8px 2px}

  /* setup */
  .setup{padding:32px 44px 40px;max-width:1280px;margin:0 auto}
  .setcols{display:grid;grid-template-columns:1fr;gap:30px}
  @media(min-width:960px){.setcols{grid-template-columns:minmax(0,1.55fr) minmax(300px,0.85fr)}}
  .shead{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:0 0 4px}
  .ssub{font-size:14.5px;color:var(--ep-text2);margin:0 0 20px;max-width:600px}
  .setgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
  .rescard{border:1px solid var(--ep-line);border-radius:14px;padding:13px 14px;background:var(--ep-card)}
  .rescard .rhead{margin-bottom:0}
  .rescard .setpips{margin:9px 0 11px;min-height:26px}
  .rescard .pm{justify-content:flex-start}
  .rescard .numin{width:58px}
  /* right-hand summary panel — fills the page and previews the loadout */
  .setside{align-self:start;position:sticky;top:88px;background:var(--ep-soft);border:1px solid var(--ep-line);
           border-radius:20px;padding:22px 22px 24px}
  .sidehero{text-align:center;padding:4px 0 16px}
  .emblem{width:58px;height:58px;border-radius:17px;background:var(--ep-accent);color:#fff;
          display:inline-flex;align-items:center;justify-content:center;font-size:29px}
  @media (prefers-color-scheme:dark){.emblem{color:#04241c}}
  .stitle{font-size:25px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;margin-top:12px}
  .stitle b{color:var(--ep-accent);font-weight:800}
  .stag{font-size:13.5px;color:var(--ep-text2);margin:5px auto 0;max-width:250px}
  .loadout{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin:6px 0 18px}
  .lt{background:var(--ep-card);border:1px solid var(--ep-line);border-radius:13px;padding:12px 14px}
  .lt .lv{font-size:22px;font-weight:800;letter-spacing:-.01em;line-height:1.05}
  .lt .ll{font-size:12px;color:var(--ep-text3);margin-top:2px}
  .prio{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 6px}
  .pchip{position:relative;font:inherit;font-size:13.5px;font-weight:600;padding:9px 16px;border-radius:999px;cursor:pointer;
         border:1px solid var(--ep-line2);background:var(--ep-card);color:var(--ep-text2)}
  .pchip.on{background:var(--ep-accent-bg);border-color:var(--ep-accent);color:var(--ep-accent)}
  /* hover explainer for the priority chips */
  .pchip[data-tip]:hover::after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 9px);
    transform:translateX(-50%);width:230px;background:var(--ep-text);color:var(--ep-card);font-size:12.5px;
    font-weight:500;line-height:1.4;text-align:left;padding:9px 12px;border-radius:10px;z-index:30;
    box-shadow:0 4px 14px rgba(0,0,0,.22);pointer-events:none}
  .pchip[data-tip]:hover::before{content:"";position:absolute;left:50%;bottom:calc(100% + 3px);
    transform:translateX(-50%);border:6px solid transparent;border-top-color:var(--ep-text);z-index:30;pointer-events:none}
  .note{font-size:13px;color:var(--ep-text2);margin:6px 0 0;max-width:640px}

  /* setup number entry */
  .numin{font:inherit;width:66px;font-size:16px;font-weight:700;text-align:center;padding:7px 6px;border-radius:9px;
         border:1px solid var(--ep-line2);background:var(--ep-card);color:var(--ep-text);font-variant-numeric:tabular-nums}
  .numin:focus{outline:0;border-color:var(--ep-accent);box-shadow:0 0 0 3px var(--ep-accent-bg)}
  .setpips{display:flex;flex-wrap:wrap;gap:4px;flex:1;min-height:26px;align-content:center}

  /* buttons / report */
  .act{display:flex;justify-content:center;gap:10px;padding:18px 40px 30px;flex-wrap:wrap}
  .btn{font:inherit;font-size:15px;font-weight:600;border-radius:12px;padding:11px 20px;cursor:pointer;
       border:1px solid var(--ep-line2);background:var(--ep-card);color:var(--ep-text);
       display:inline-flex;align-items:center;gap:8px;text-decoration:none}
  .btn:hover{background:var(--ep-soft)}
  .btn.primary{background:var(--ep-accent);border-color:var(--ep-accent);color:#fff}
  @media (prefers-color-scheme:dark){.btn.primary{color:#04241c}}
  .btn.big{font-size:17px;padding:14px 28px}

  .report{padding:32px 48px 10px;text-align:center}
  .rphase{font-size:12.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ep-accent);
          display:flex;align-items:center;gap:8px;justify-content:center;margin-bottom:6px}
  .rtitle{font-size:34px;font-weight:800;letter-spacing:-.02em;margin:0 0 6px}
  .stars{font-size:38px;color:var(--ep-line2);display:flex;gap:6px;justify-content:center;margin:4px 0 6px}
  .stars i.on{color:var(--c-ideal)}
  .verdict{font-size:18px;font-weight:600;margin:0 0 22px;color:var(--ep-text2)}
  .rbig{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin:0 0 22px}
  .rtile{background:var(--ep-soft);border:1px solid var(--ep-line);border-radius:16px;padding:18px}
  .rtile .rv{font-size:36px;font-weight:800;letter-spacing:-.02em}
  .rtile .rk{font-size:13.5px;color:var(--ep-text2);font-weight:600;margin-top:3px}
  .rtile.good .rv{color:var(--c-good)} .rtile.warn .rv{color:var(--ep-warn)} .rtile.bad .rv{color:var(--c-bad)}
  .rgrid{display:grid;grid-template-columns:1fr;gap:20px;text-align:left;margin-bottom:8px}
  @media(min-width:860px){.rgrid{grid-template-columns:1.15fr 1fr;align-items:start}}
  .rcard{background:var(--ep-card);border:1px solid var(--ep-line);border-radius:16px;padding:18px 20px}
  .kpibars{text-align:left}
  .kpirow{margin-bottom:14px}
  .kpirow:last-child{margin-bottom:0}
  .kpirow .kl{display:flex;justify-content:space-between;font-size:14px;font-weight:700;margin-bottom:6px}
  .kpirow .kl .kv{font-variant-numeric:tabular-nums}
  .rolls{background:var(--ep-bad-bg);border-radius:16px;padding:16px 20px;margin:16px 0 8px;text-align:left;font-size:14px}
  .rolls .rt{font-weight:700;color:var(--ep-text);margin-bottom:8px;display:flex;align-items:center;gap:7px}
  .rolls ul{margin:0;padding-left:18px;color:var(--ep-text2)}
  .rolls li{margin-bottom:3px}

  #scripted{width:100%;border:0;display:block;height:calc(100vh - 74px);min-height:700px}
  .hide{display:none !important}
</style>
</head>
<body>
<div class="ept">
<h2 class="sr">EP Lab Tycoon control panel: run a day in an electrophysiology lab by hand. Edit staff, room, bed and equipment availability at any time, advance each case through its steps yourself, and watch a live dashboard compare how the day is really going against the ideal plan.</h2>
<div class="frame">
  <div class="top">
    <div class="brand"><span class="logo" aria-hidden="true"><i class="ti ti-heartbeat"></i></span> EP Lab Tycoon</div>
    <div class="tabs">
      <button class="tab on" id="tab-manual" data-mode="manual"><i class="ti ti-adjustments" aria-hidden="true"></i> Run the lab yourself</button>
      <button class="tab" id="tab-scripted" data-mode="scripted"><i class="ti ti-cards" aria-hidden="true"></i> Play a guided day</button>
    </div>
  </div>

  <div id="manual">
    <div id="clockwrap"></div>
    <div id="hud"></div>
    <div id="body"></div>
  </div>

  <iframe id="scripted" class="hide" title="Play a guided day"></iframe>
</div>
</div>

<script src="sim.js"></script>
<script>
(function(){
  'use strict';
  var DAY0 = 7*60, FIRST = 8*60, SCHED_END = 17*60, HARD = 19*60;
  var CREW = EPSim.CREW_PER_ROOM, BPN = EPSim.BEDS_PER_RECOVERY_NURSE;
  var COSTS = EPSim.COSTS, CT = EPSim.CASE_TYPES;

  var M = null;
  var FORM = {cases:6, rooms:2, phys:2, nurses:5, techs:4, beds:4, ward:2, seed:20260727, profile:'balanced'};
  // per-resource icon + display cap for the fill controls
  var RES = {
    cases: {icon:'ti-user',           max:12, label:'Cases booked'},
    rooms: {icon:'ti-door',           max:8,  label:'EP labs (rooms)'},
    phys:  {icon:'ti-user-heart',     max:6,  label:'EP physicians'},
    nurses:{icon:'ti-heart-handshake',max:10, label:'Nurses'},
    techs: {icon:'ti-tool',           max:10, label:'Techs'},
    beds:  {icon:'ti-bed',            max:10, label:'Recovery beds'},
    ward:  {icon:'ti-building-hospital',max:8,label:'Ward beds free'}
  };
  var autoTimer = null;

  function $(id){ return document.getElementById(id); }
  function hhmm(m){ return EPSim.hhmm(m); }
  function clamp(v,lo,hi){ return Math.max(lo,Math.min(hi,v)); }
  function avg(a){ return a.length ? a.reduce(function(x,y){return x+y;},0)/a.length : 0; }

  /* ---- mode switch ---- */
  document.querySelector('.tabs').addEventListener('click', function(e){
    var t = e.target.closest('.tab'); if (!t) return;
    setMode(t.getAttribute('data-mode'));
  });
  function setMode(mode){
    var manual = mode === 'manual';
    $('tab-manual').classList.toggle('on', manual);
    $('tab-scripted').classList.toggle('on', !manual);
    $('manual').classList.toggle('hide', !manual);
    $('scripted').classList.toggle('hide', manual);
    if (!manual && !$('scripted').getAttribute('src')) $('scripted').setAttribute('src','play.html');
    if (manual && autoTimer) stopAuto();
  }

  /* ---- roster (reuse sim.js patient generator) ---- */
  function buildRoster(cfg, seed){
    var r = EPSim.runDay({config:cfg, seed:seed, policy:EPSim.replay([])});
    return r.patients.map(function(p){
      return { id:p.id, name:p.name, type:p.type, typeLabel:p.typeLabel,
        planned:p.planned, recoveryMin:p.recoveryMin, inpatient:p.inpatient,
        daysWaiting:p.daysWaiting, acuity:p.acuity, complication:false,
        status:'booked', room:null,
        startedAt:null, procDoneAt:null, recoveredAt:null, dischargedAt:null, cancelReason:null };
    });
  }

  function openLab(){
    var cfg = {cases:FORM.cases, rooms:FORM.rooms, phys:FORM.phys, nurses:FORM.nurses, techs:FORM.techs, beds:FORM.beds};
    M = {
      clock: DAY0, cfg: cfg, seed: FORM.seed, profile: FORM.profile,
      avail: { ep:FORM.phys, nurse:FORM.nurses, tech:FORM.techs },
      staffPlanned: { ep:FORM.phys, nurse:FORM.nurses, tech:FORM.techs },
      rooms: [], bedsTotal:FORM.beds, wardFree:FORM.ward,
      equip: { mapping:true, imaging:true, supply:true },
      cases: buildRoster(cfg, FORM.seed),
      feed: [], charges: 0, missedBreaks: 0
    };
    for (var i=0;i<FORM.rooms;i++) M.rooms.push({ id:i, label:'EP lab '+(i+1), open:true });
    log('The lab opens for the day — '+FORM.cases+' cases on the board.', 'start');
    renderAll();
  }
  function log(text, kind){ M.feed.push({ t:M.clock, text:text, kind:kind||'' }); }

  /* ---- resource accounting ---- */
  function procCases(){ return M.cases.filter(function(c){ return c.status==='procedure'; }); }
  function roomOccupied(){
    var s={}; M.cases.forEach(function(c){ if ((c.status==='procedure'||c.status==='blocked') && c.room!=null) s[c.room]=1; });
    return s;
  }
  function recoveryOccupied(){ return M.cases.filter(function(c){ return c.status==='recovery'; }).length; }
  function recoveryNursesNeeded(){ return Math.ceil(recoveryOccupied()/BPN); }
  function nursesInRooms(){ return procCases().length; }
  function usableBeds(){ return Math.min(M.bedsTotal, Math.max(0, M.avail.nurse - nursesInRooms())*BPN); }
  function freeBeds(){ return Math.max(0, usableBeds() - recoveryOccupied()); }
  function freeRoom(){
    var occ = roomOccupied();
    for (var i=0;i<M.rooms.length;i++) if (M.rooms[i].open && !occ[M.rooms[i].id]) return M.rooms[i];
    return null;
  }
  function startBlock(c){
    if (!freeRoom()) return 'no open room free';
    if (!M.equip.mapping) return 'mapping system down';
    if (!M.equip.imaging) return 'imaging down';
    if (c.type==='af' && !M.equip.supply) return 'no ablation catheters';
    var np = nursesInRooms()+1;
    if (np > M.avail.ep) return 'no EP physician free';
    if (np + recoveryNursesNeeded() > M.avail.nurse) return 'no nurse free';
    if (np*CREW.tech > M.avail.tech) return 'not enough techs';
    return null;
  }

  /* ---- case actions ---- */
  function startCase(id){
    var c=byId(id); if (!c||c.status!=='booked'||startBlock(c)) return;
    var room=freeRoom();
    c.status='procedure'; c.room=room.id; c.startedAt=M.clock;
    log(c.name+' — '+c.typeLabel+' started in '+room.label, 'start'); renderAll();
  }
  function procComplete(id){
    var c=byId(id); if (!c||c.status!=='procedure') return;
    c.procDoneAt=M.clock;
    if (freeBeds()>0){ c.status='recovery'; c.recoveredAt=M.clock; c.room=null;
      log(c.name+' — procedure complete, into recovery', 'discharge'); }
    else { c.status='blocked'; log(roomLabel(c.room)+' blocked — no recovery bed for '+c.name, 'block'); }
    renderAll();
  }
  function moveToRecovery(id){
    var c=byId(id); if (!c||c.status!=='blocked'||freeBeds()<=0) return;
    c.status='recovery'; c.recoveredAt=M.clock; c.room=null;
    log(c.name+' finally moved to recovery', 'discharge'); renderAll();
  }
  function discharge(id){
    var c=byId(id); if (!c||c.status!=='recovery') return;
    if (c.inpatient && M.wardFree<=0) return;
    if (c.inpatient) M.wardFree--;
    c.status='discharged'; c.dischargedAt=M.clock;
    log(c.name+' discharged — case complete', 'discharge'); renderAll();
  }
  function cancelCase(id){
    var c=byId(id); if (!c||c.status!=='booked') return;
    c.status='cancelled'; c.cancelReason='cancelled by you';
    log(c.name+' — '+c.typeLabel+' cancelled', 'cancel'); renderAll();
  }
  function toggleComplication(id){
    var c=byId(id); if (!c||c.status==='booked'||c.status==='cancelled') return;
    c.complication=!c.complication;
    log(c.name+(c.complication?' — complication flagged':' — complication cleared'), c.complication?'complication':''); renderAll();
  }
  function byId(id){ for (var i=0;i<M.cases.length;i++) if (M.cases[i].id===id) return M.cases[i]; return null; }
  function roomLabel(id){ var r=M.rooms[id]; return r?r.label:'a room'; }

  /* ---- live edits ---- */
  function setStaff(role, v){ M.avail[role]=clamp(v,0,20);
    log((v>M.avail[role]?'':'')+roleName(role)+' available now '+M.avail[role], ''); renderAll(); }
  function bumpStaff(role,d){ var v=clamp(M.avail[role]+d,0,20); var was=M.avail[role]; M.avail[role]=v;
    log((d>0?'Extra ':'One fewer ')+roleName(role)+' available now ('+v+')', d<0&&v<was?'block':''); renderAll(); }
  function bumpBeds(d){ M.bedsTotal=clamp(M.bedsTotal+d,0,20); log('Recovery beds set to '+M.bedsTotal, ''); renderAll(); }
  function bumpWard(d){ M.wardFree=clamp(M.wardFree+d,0,20); log('Ward beds free set to '+M.wardFree, ''); renderAll(); }
  function toggleRoom(id){ var r=M.rooms[id]; if (!r||roomOccupied()[id]) return;
    r.open=!r.open; log(r.label+(r.open?' opened':' closed'), r.open?'':'block'); renderAll(); }
  function toggleEquip(key){ M.equip[key]=!M.equip[key];
    var name={mapping:'3D mapping system',imaging:'Fluoroscopy / imaging',supply:'Ablation catheter stock'}[key];
    log(name+(M.equip[key]?' back available':' marked unavailable'), M.equip[key]?'':'block'); renderAll(); }
  function roleName(r){ return {ep:'EP physician',nurse:'nurse',tech:'tech'}[r]; }

  /* ---- clock / playback ----
     Auto-run moves in small 2-minute steps on a short interval so the line and
     the clock grow smoothly rather than jumping. */
  var STEP=2, TICK=200;
  function advance(mins){ M.clock=Math.min(HARD, M.clock+mins); renderTick(); if (M.clock>=HARD) stopAuto(); }
  function startAuto(){ if (autoTimer) return;
    autoTimer=setInterval(function(){ if (M.clock>=HARD){ stopAuto(); return; } M.clock=Math.min(HARD,M.clock+STEP); renderTick(); }, TICK);
    renderPlayer(); }
  function stopAuto(){ if (autoTimer){ clearInterval(autoTimer); autoTimer=null; } renderPlayer(); }

  /* The furthest point real actions have reached — you cannot act before it,
     so scrubbing behind it is a read-only "review" of how the day looked then. */
  function liveEdge(){
    var t=DAY0;
    M.cases.forEach(function(c){ [c.startedAt,c.procDoneAt,c.recoveredAt,c.dischargedAt].forEach(function(x){ if (x!=null && x>t) t=x; }); });
    return t;
  }
  function reviewing(){ return M.clock < liveEdge()-1e-9; }
  function seek(t){ M.clock=clamp(Math.round(t),DAY0,HARD); renderTick(); }

  /* ---- metrics ---- */
  function liveMetrics(){
    var done=M.cases.filter(function(c){ return c.status==='discharged'; });
    var cancelled=M.cases.filter(function(c){ return c.status==='cancelled'; });
    var inflight=M.cases.filter(function(c){ return c.status==='procedure'||c.status==='blocked'||c.status==='recovery'; });
    var booked=M.cases.filter(function(c){ return c.status==='booked'; });
    var compl=M.cases.filter(function(c){ return c.complication; }).length;
    var heads=M.staffPlanned.ep+M.staffPlanned.nurse+M.staffPlanned.tech;
    var otPerHead=Math.max(0, M.clock-SCHED_END);
    var regMin=Math.max(0, Math.min(M.clock,SCHED_END)-DAY0)/60, otMin=Math.max(0, M.clock-SCHED_END)/60;
    var staffCost=0;
    ['ep','nurse','tech'].forEach(function(role){
      var rate=COSTS.hourly[role]||0, n=M.staffPlanned[role];
      staffCost += n*(regMin*rate + otMin*rate*COSTS.overtimeMultiplier);
    });
    var roomCost=M.rooms.filter(function(r){return r.open;}).length*Math.max(0,M.clock-DAY0)/60*COSTS.roomHour;
    var supplyCost=done.reduce(function(a,c){ return a+CT[c.type].supply; },0);
    var funding=done.reduce(function(a,c){ return a+CT[c.type].funding; },0);
    var total=staffCost+roomCost+supplyCost+M.charges;
    return { done:done, cancelled:cancelled, inflight:inflight, booked:booked, compl:compl,
      heads:heads, overtimeMinutes:otPerHead*heads, otPerHead:otPerHead,
      totalCost:Math.round(total), funding:Math.round(funding), margin:Math.round(funding-total),
      costPerCase: done.length?Math.round(total/done.length):Math.round(total) };
  }
  function scoreMetrics(){
    var lm=liveMetrics(), completed=lm.done.length, cancelledN=lm.cancelled.length, booked=M.cases.length;
    var worked=Math.max(0,M.clock-DAY0);
    var maxFatigue=clamp(worked/600*0.30 + lm.otPerHead/180*0.40, 0, 1);
    var deferredHarm=booked?clamp(cancelledN/booked*(cancelledN?avg(lm.cancelled.map(function(c){return clamp(c.daysWaiting/365,0,1);})):0),0,1):0;
    var m={ booked:booked, addOns:0, completed:completed, cancelled:cancelledN,
      complicationRate:completed?lm.compl/completed:0, maxFatigue:Math.round(maxFatigue*100)/100,
      deferredHarm:deferredHarm, staffCount:lm.heads, overtimeMinutes:lm.overtimeMinutes,
      missedBreaks:M.missedBreaks, costPerCase:lm.costPerCase };
    m.kpis=EPSim.kpis(m); return m;
  }

  /* ==================================================================
     RENDER
     ================================================================== */
  function renderAll(){ renderPlayer(); renderHUD(); renderBody(); }

  /* Light update on every clock change — only touches the time-sensitive nodes
     in place, so auto-run stays smooth and neither the case board nor the speed
     dial rebuilds under your cursor. */
  function renderTick(){
    if (!M) return;
    var span=HARD-DAY0, pct=(M.clock-DAY0)/span*100, bufPct=(Math.max(liveEdge(),M.clock)-DAY0)/span*100;
    var cf=$('clockface'); if (cf){ cf.textContent=hhmm(M.clock); cf.classList.toggle('late', M.clock>SCHED_END); }
    var pt=$('ptimecur'); if (pt) pt.textContent=hhmm(M.clock);
    var pr=$('prog');  if (pr) pr.style.width=pct+'%';
    var th=$('thumb'); if (th) th.style.left=pct+'%';
    var bf=$('buf');   if (bf) bf.style.width=bufPct+'%';
    renderHUD();
    var pc=$('pacecard'); if (pc) pc.innerHTML=paceCardInner();
    var d=document.querySelector('.dash'); if (d) d.classList.toggle('reviewing', reviewing());
    var rb=$('reviewbar');
    if (rb){ rb.style.display=reviewing()?'':'none'; var rt=$('reviewtime'); if (rt) rt.textContent=hhmm(M.clock); }
    else if (reviewing()) renderPlayer();
  }

  function speedLabel(){ var m=STEP/2; return (Number.isInteger(m)?m:m.toFixed(1))+'×'; }

  function renderPlayer(){
    if (!M){ $('clockwrap').innerHTML=''; return; }
    var late=M.clock>SCHED_END, rev=reviewing(), span=HARD-DAY0;
    var pct=(M.clock-DAY0)/span*100, bufPct=(Math.max(liveEdge(),M.clock)-DAY0)/span*100;
    $('clockwrap').innerHTML =
      '<div class="clockbar">'+
        '<button class="tbtn ghost" id="tosetup"><i class="ti ti-arrow-left"></i> Set-up</button>'+
        '<span class="clockface'+(late?' late':'')+'" id="clockface">'+hhmm(M.clock)+'</span>'+
        '<div class="tadv">'+
          '<button class="tbtn" data-adv="15">+15m</button>'+
          '<button class="tbtn" data-adv="30">+30m</button>'+
          '<button class="tbtn" data-adv="60">+1h</button>'+
        '</div><div class="grow"></div>'+
        '<button class="btn primary" id="endshift"><i class="ti ti-flag-checkered"></i> End shift</button></div>'+
      '<div class="scrub">'+
        '<button class="pbtn" id="playpause" aria-label="'+(autoTimer?'Pause':'Play')+'">'+
          '<i class="ti ti-player-'+(autoTimer?'pause':'play')+'"></i></button>'+
        '<span class="ptime cur" id="ptimecur">'+hhmm(M.clock)+'</span>'+
        '<div class="track" id="seek" role="slider" aria-label="Time of day">'+
          '<div class="buf" id="buf" style="width:'+bufPct+'%"></div>'+
          '<div class="prog" id="prog" style="width:'+pct+'%"></div>'+
          '<div class="thumb" id="thumb" style="left:'+pct+'%"></div>'+
        '</div>'+
        '<span class="ptime">'+hhmm(HARD)+'</span>'+
        '<div class="speed"><span class="slab">Speed</span>'+
          '<input type="range" id="speed" min="1" max="12" step="1" value="'+STEP+'" aria-label="Playback speed">'+
          '<span class="sval" id="sval">'+speedLabel()+'</span></div>'+
      '</div>'+
      '<div class="review" id="reviewbar" style="display:'+(rev?'':'none')+'"><i class="ti ti-eye"></i>'+
        'Reviewing <span id="reviewtime">'+hhmm(M.clock)+'</span> — controls are locked while you look back at the day.'+
        '<button class="tbtn" id="jumplive"><i class="ti ti-player-track-next"></i> Return to live</button></div>';
  }

  function renderHUD(){
    if (!M){ $('hud').innerHTML=''; return; }
    var lm=liveMetrics(), late=lm.otPerHead;
    var behind=behindBy();
    $('hud').innerHTML = '<div class="hud">'+
      met('ti-stethoscope','Cases completed', lm.done.length+'<span class="u"> / '+M.cases.length+'</span>', lm.done.length?'good':'') +
      met('ti-gauge','Pace vs plan', behind<=0?'On track':(behind+' behind'), behind<=0?'good':'bad') +
      met('ti-activity','In progress', lm.inflight.length, '') +
      met('ti-user-x','Sent away', lm.cancelled.length, lm.cancelled.length===0?'good':lm.cancelled.length<=2?'warn':'bad') +
      met('ti-clock','Overtime', late+'<span class="u"> min</span>', late===0?'good':late<=60?'warn':'bad') +
      met('ti-cash','Margin', '$'+lm.margin.toLocaleString(), lm.margin>=0?'good':'bad') +
    '</div>';
  }
  function met(icon,k,v,cls){
    return '<div class="met '+cls+'"><div class="k"><i class="ti '+icon+'" aria-hidden="true"></i>'+k+'</div>'+
           '<div class="v '+cls+'">'+v+'</div></div>';
  }
  // cases the plan says should be done by now, minus what actually is
  function idealDoneNow(){ return M.cases.length*clamp((M.clock-FIRST)/(SCHED_END-FIRST),0,1); }
  function actualDoneNow(){ return M.cases.filter(function(c){ return c.procDoneAt!=null && c.procDoneAt<=M.clock; }).length; }
  function behindBy(){ return Math.max(0, Math.round(idealDoneNow()-actualDoneNow())); }

  function renderBody(){
    if (!M){ $('body').innerHTML=setup(); return; }
    $('body').innerHTML =
      '<div class="dash'+(reviewing()?' reviewing':'')+'">'+
        '<div class="col-left"><div class="card">'+resources()+'</div></div>'+
        '<div class="col-main">'+
          '<div class="card" id="pacecard">'+paceCardInner()+'</div>'+
          '<div class="card">'+flowCard()+'</div>'+
          '<div class="card">'+caseBoard()+'</div>'+
        '</div>'+
        '<div class="col-right"><div class="card">'+feed()+'</div></div>'+
      '</div>';
    var chat=$('chat'); if (chat) chat.scrollTop=chat.scrollHeight;   // keep newest message in view
  }

  /* ---- pace chart: ideal (yellow) vs actual (green/red) ---- */
  function paceCardInner(){
    var behind=behindBy();
    var ok=behind<=0;
    return '<p class="ctitle">Progress vs. the ideal plan'+
        '<span class="sub">cases completed by time of day</span></p>'+
      paceSVG()+
      '<div class="clegend">'+
        '<span class="key"><span class="kln ideal"></span>Ideal plan</span>'+
        '<span class="key"><span class="kln good"></span>On or ahead</span>'+
        '<span class="key"><span class="kln bad"></span>Behind plan</span>'+
      '</div>'+
      '<div class="status '+(ok?'good':'bad')+'"><i class="ti ti-'+(ok?'circle-check':'alert-triangle')+'"></i>'+
        (ok ? 'On track — keeping pace with the plan.'
            : behind+' case'+(behind===1?'':'s')+' behind where the plan wants you by '+hhmm(M.clock)+'.')+
      '</div>';
  }
  function paceSVG(){
    var total=Math.max(1,M.cases.length);
    var t0=DAY0,t1=HARD,W=560,H=210,padL=30,padR=14,padT=14,padB=26;
    function X(t){ return padL+(clamp(t,t0,t1)-t0)/(t1-t0)*(W-padL-padR); }
    function Y(v){ return H-padB-(v/total)*(H-padT-padB); }
    function ideal(t){ return total*clamp((t-FIRST)/(SCHED_END-FIRST),0,1); }

    // gridlines + y ticks
    var g='', yt=[0, Math.ceil(total/2), total], seen={};
    yt.forEach(function(v){ if (seen[v]) return; seen[v]=1;
      g+='<line x1="'+padL+'" y1="'+Y(v)+'" x2="'+(W-padR)+'" y2="'+Y(v)+'" stroke="var(--ep-line)" stroke-width="1"/>'+
         '<text x="'+(padL-6)+'" y="'+(Y(v)+4)+'" text-anchor="end" font-size="11" fill="var(--ep-text3)">'+v+'</text>';
    });
    // x ticks every 2h
    var xt='';
    for (var t=DAY0; t<=t1; t+=120){ xt+='<text x="'+X(t)+'" y="'+(H-8)+'" text-anchor="middle" font-size="11" fill="var(--ep-text3)">'+
      hhmm(t).replace(':00','').replace(' ','')+'</text>'; }

    // ideal dashed line
    var idPts=[[FIRST,0],[SCHED_END,total],[t1,total]];
    var idStr=idPts.map(function(p){ return X(p[0])+','+Y(p[1]); }).join(' ');
    var idLine='<polyline points="'+X(t0)+','+Y(0)+' '+idStr+'" fill="none" stroke="var(--c-ideal)" stroke-width="2.5" stroke-dasharray="6 5" stroke-linecap="round"/>';

    // actual step line, coloured per segment
    var comp=M.cases.filter(function(c){ return c.procDoneAt!=null && c.procDoneAt<=M.clock; })
                    .map(function(c){ return c.procDoneAt; }).sort(function(a,b){ return a-b; });
    var segs='', n=0, prevT=t0;
    comp.forEach(function(te){
      var behind=n < ideal(te)-1e-9;
      segs+='<line x1="'+X(prevT)+'" y1="'+Y(n)+'" x2="'+X(te)+'" y2="'+Y(n)+'" stroke="var('+(behind?'--c-bad':'--c-good')+')" stroke-width="3" stroke-linecap="round"/>';
      segs+='<line x1="'+X(te)+'" y1="'+Y(n)+'" x2="'+X(te)+'" y2="'+Y(n+1)+'" stroke="var(--c-good)" stroke-width="3" stroke-linecap="round"/>';
      n++; prevT=te;
    });
    var now=Math.min(M.clock,t1);
    var behindNow = n < ideal(now)-1e-9;
    segs+='<line x1="'+X(prevT)+'" y1="'+Y(n)+'" x2="'+X(now)+'" y2="'+Y(n)+'" stroke="var('+(behindNow?'--c-bad':'--c-good')+')" stroke-width="3" stroke-linecap="round"/>';
    var dot='<circle cx="'+X(now)+'" cy="'+Y(n)+'" r="4.5" fill="var('+(behindNow?'--c-bad':'--c-good')+')"/>';
    // now cursor
    var cursor='<line x1="'+X(now)+'" y1="'+padT+'" x2="'+X(now)+'" y2="'+(H-padB)+'" stroke="var(--ep-text3)" stroke-width="1" stroke-dasharray="2 3" opacity="0.6"/>';

    return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Cases completed versus the ideal plan">'+
      g+xt+cursor+idLine+segs+dot+'</svg>';
  }

  /* ---- case-flow stacked bar ---- */
  function flowCard(){
    var buckets=[
      {k:'done',   label:'Completed', color:'var(--c-good)',  n:M.cases.filter(function(c){return c.status==='discharged';}).length},
      {k:'rec',    label:'In recovery',color:'var(--ep-accent)',n:recoveryOccupied()},
      {k:'proc',   label:'In procedure',color:'var(--s-proc)', n:procCases().length},
      {k:'block',  label:'Blocked',   color:'var(--c-bad)',   n:M.cases.filter(function(c){return c.status==='blocked';}).length},
      {k:'wait',   label:'Waiting',   color:'var(--ep-line2)',n:M.cases.filter(function(c){return c.status==='booked';}).length},
      {k:'canc',   label:'Sent away', color:'var(--c-ideal)', n:M.cases.filter(function(c){return c.status==='cancelled';}).length}
    ];
    var total=M.cases.length||1;
    var segs=buckets.filter(function(b){return b.n>0;}).map(function(b){
      return '<div class="flseg" style="width:'+(b.n/total*100)+'%;background:'+b.color+'" title="'+b.label+': '+b.n+'">'+
        (b.n/total>0.06?b.n:'')+'</div>';
    }).join('');
    var keys=buckets.filter(function(b){return b.n>0;}).map(function(b){
      return '<span><span class="sw" style="background:'+b.color+'"></span>'+b.label+' '+b.n+'</span>';
    }).join('');
    return '<p class="ctitle">Where every case stands</p>'+
      '<div class="flow">'+segs+'</div><div class="flkey">'+keys+'</div>';
  }

  /* ---- case board ---- */
  function caseBoard(){
    var groups={ procedure:{label:'In a procedure',items:[]}, blocked:{label:'Waiting for a recovery bed',items:[]},
      recovery:{label:'In recovery',items:[]}, booked:{label:'Waiting to start',items:[]}, done:{label:'Finished',items:[]} };
    M.cases.forEach(function(c){
      var g=(c.status==='discharged'||c.status==='cancelled')?'done':c.status;
      (groups[g]||groups.done).items.push(c);
    });
    groups.booked.items.sort(function(a,b){ return a.acuity-b.acuity || b.daysWaiting-a.daysWaiting; });
    var h='<p class="ctitle">Cases <span class="sub">advance each one yourself</span></p>';
    ['procedure','blocked','recovery','booked','done'].forEach(function(g){
      var grp=groups[g]; if (!grp.items.length) return;
      h+='<div class="cgrp"><p class="cglab">'+grp.label+' <span class="n">'+grp.items.length+'</span></p>'+
         grp.items.map(caseRow).join('')+'</div>';
    });
    return h;
  }
  function caseRow(c){
    var cls=c.status, badges='';
    if (c.inpatient && c.status!=='discharged' && c.status!=='cancelled') badges+='<span class="badge inp">inpatient</span>';
    if (c.complication) badges+='<span class="badge compl">complication</span>';
    var sub, act='';
    if (c.status==='booked'){
      var reason=startBlock(c);
      sub='waiting '+c.daysWaiting+' d · '+c.planned+' min booked';
      act='<button class="mini primary" data-do="start" data-id="'+c.id+'"'+(reason?' disabled':'')+'><i class="ti ti-player-play"></i> Start</button>'+
          '<button class="mini warn" data-do="cancel" data-id="'+c.id+'"><i class="ti ti-x"></i></button>'+
          (reason?'<span class="why"><i class="ti ti-ban"></i>'+reason+'</span>':'');
    } else if (c.status==='procedure'){
      sub='in '+roomLabel(c.room)+' · started '+hhmm(c.startedAt);
      act=complBtn(c)+'<button class="mini primary" data-do="proc" data-id="'+c.id+'"><i class="ti ti-check"></i> Procedure complete</button>';
    } else if (c.status==='blocked'){
      var noBed=freeBeds()<=0;
      sub='procedure done '+hhmm(c.procDoneAt)+' · holding '+roomLabel(c.room);
      act=complBtn(c)+'<button class="mini primary" data-do="move" data-id="'+c.id+'"'+(noBed?' disabled':'')+'><i class="ti ti-bed"></i> To recovery</button>'+(noBed?'<span class="why"><i class="ti ti-ban"></i>no bed free</span>':'');
    } else if (c.status==='recovery'){
      var wardBlock=c.inpatient && M.wardFree<=0;
      sub='recovering since '+hhmm(c.recoveredAt);
      act=complBtn(c)+'<button class="mini primary" data-do="discharge" data-id="'+c.id+'"'+(wardBlock?' disabled':'')+'><i class="ti ti-logout"></i> Discharge</button>'+(wardBlock?'<span class="why"><i class="ti ti-ban"></i>ward full</span>':'');
    } else if (c.status==='discharged'){ sub='discharged '+hhmm(c.dischargedAt); }
    else { sub=c.cancelReason||'cancelled'; }
    return '<div class="case '+cls+'"><div class="cmain"><div class="cname">'+c.name+' '+badges+'</div>'+
      '<div class="csub">'+c.typeLabel+' · '+sub+'</div></div><div class="cact">'+act+'</div></div>';
  }
  function complBtn(c){
    return '<button class="mini icon" data-do="compl" data-id="'+c.id+'" title="Flag a complication"><i class="ti ti-alert-triangle"></i></button>';
  }

  /* ---- feed: a chat-style thread, newest at the bottom ---- */

  /* ---- report ---- */
  function endShift(){
    stopAuto();
    var m=scoreMetrics(), w=EPSim.PROFILES[M.profile].w, sc=EPSim.score(m,w);
    var stars=sc>=0.80?5:sc>=0.64?4:sc>=0.46?3:sc>=0.28?2:1;
    var verd=['Rough day — the review below shows where it went.','Several trades went the wrong way today.',
              'A middle-of-the-road line through today.','Sharp calls — near the top of what today allowed.',
              'You ran today about as well as it could be run.'][stars-1];
    var st=''; for (var i=0;i<5;i++) st+='<i class="ti ti-star'+(i<stars?' on':'')+'"></i>';
    var lm=liveMetrics();
    var doneCls=m.completed===m.booked?'good':m.completed>=m.booked*0.6?'warn':'bad';
    var otCls=m.overtimeMinutes===0?'good':m.overtimeMinutes<=120?'warn':'bad';
    var mgCls=lm.margin>=0?'good':'bad';

    var rolled=M.cases.filter(function(c){ return c.status!=='discharged'; }).sort(function(a,b){ return b.daysWaiting-a.daysWaiting; });
    var rollHtml=rolled.length?'<div class="rolls"><div class="rt"><i class="ti ti-calendar-due"></i>Not finished today — rolls to tomorrow</div><ul>'+
      rolled.map(function(c){ return '<li>'+c.name+' — '+c.typeLabel+', waiting '+c.daysWaiting+' days · '+
        (c.status==='cancelled'?c.cancelReason:'left in '+c.status)+'</li>'; }).join('')+'</ul></div>':'';

    var kb=[['Safety',m.kpis.safety],['Throughput',m.kpis.through],['Staff wellbeing',m.kpis.staff],['Cost efficiency',m.kpis.cost]]
      .map(function(r){
        var p=Math.round(r[1]*100), col=p>=66?'var(--c-good)':p>=40?'var(--c-ideal)':'var(--c-bad)';
        return '<div class="kpirow"><div class="kl"><span>'+r[0]+'</span><span class="kv">'+p+'%</span></div>'+
          '<div class="bar"><div class="fill" style="width:'+p+'%;background:'+col+'"></div></div></div>';
      }).join('');

    $('hud').innerHTML=''; $('clockwrap').innerHTML='';
    $('body').innerHTML =
      '<div class="report">'+
        '<div class="rphase"><i class="ti ti-clipboard-check"></i>'+hhmm(M.clock)+' · end of shift</div>'+
        '<h2 class="rtitle">Shift report</h2>'+
        '<div class="stars">'+st+'</div><p class="verdict">'+verd+'</p>'+
        '<div class="rbig">'+
          rtile(doneCls, m.completed+' / '+m.booked, 'Cases completed')+
          rtile(lm.cancelled.length?'bad':'good', lm.cancelled.length, 'Sent away')+
          rtile(otCls, m.overtimeMinutes+' min', 'Overtime')+
          rtile(lm.compl?'bad':'good', lm.compl, 'Complications')+
          rtile(mgCls, '$'+lm.margin.toLocaleString(), 'Margin')+
        '</div>'+
        '<div class="rgrid">'+
          '<div class="rcard">'+
            '<p class="ctitle">How the day tracked against plan</p>'+
            paceSVG()+
            '<div class="clegend">'+
              '<span class="key"><span class="kln ideal"></span>Ideal plan</span>'+
              '<span class="key"><span class="kln good"></span>On or ahead</span>'+
              '<span class="key"><span class="kln bad"></span>Behind plan</span>'+
            '</div>'+
          '</div>'+
          '<div class="rcard">'+
            '<p class="ctitle">Scored under '+EPSim.PROFILES[M.profile].label+'</p>'+
            '<div class="kpibars">'+kb+'</div>'+
          '</div>'+
        '</div>'+
        rollHtml+
      '</div>'+
      '<div class="act"><button class="btn" id="backboard"><i class="ti ti-arrow-left"></i> Back to the board</button>'+
      '<button class="btn primary" id="again"><i class="ti ti-refresh"></i> New day — set up again</button>'+
      '<a class="btn" href="dashboard.html"><i class="ti ti-chart-bar"></i> Where the day went</a></div>';
  }
  function rtile(cls,v,k){ return '<div class="rtile '+cls+'"><div class="rv">'+v+'</div><div class="rk">'+k+'</div></div>'; }

  /* ---- input ---- */
  $('manual').addEventListener('click', function(e){
    var el;
    if ((el=e.target.closest('[data-set]'))){
      var k=el.getAttribute('data-set'), d=+el.getAttribute('data-d'), lo=(k==='rooms'||k==='cases')?1:0;
      FORM[k]=Math.max(lo, FORM[k]+d); renderBody(); return;   // no upper limit
    }
    if ((el=e.target.closest('[data-prio]'))){ FORM.profile=el.getAttribute('data-prio'); renderBody(); return; }
    if (e.target.closest('#openlab')){ openLab(); return; }

    // playback / navigation — always allowed
    if (e.target.closest('#tosetup')){ if (confirm('Go back to set-up? This ends the current shift.')){ M=null; stopAuto(); renderAll(); } return; }
    if ((el=e.target.closest('[data-adv]'))){ advance(+el.getAttribute('data-adv')); return; }
    if (e.target.closest('#playpause')){ autoTimer?stopAuto():startAuto(); return; }
    if (e.target.closest('#jumplive')){ stopAuto(); seek(liveEdge()); renderBody(); return; }
    if (e.target.closest('#endshift')){ endShift(); return; }
    if (e.target.closest('#backboard')){ renderAll(); return; }   // report → back to the live board
    if (e.target.closest('#again')){ M=null; stopAuto(); renderAll(); return; }

    // everything below changes the lab — locked while reviewing the past
    if (reviewing()) return;

    if ((el=e.target.closest('[data-availset]'))){ setStaff(el.getAttribute('data-availset'), +el.getAttribute('data-n')); return; }
    if ((el=e.target.closest('[data-astep]'))){ bumpStaff(el.getAttribute('data-astep'), +el.getAttribute('data-d')); return; }
    if ((el=e.target.closest('[data-bump]'))){
      var key=el.getAttribute('data-bump'), dd=+el.getAttribute('data-d');
      if (key==='beds') bumpBeds(dd); else if (key==='ward') bumpWard(dd);
      return;
    }
    if ((el=e.target.closest('[data-room]'))){ toggleRoom(+el.getAttribute('data-room')); return; }
    if ((el=e.target.closest('[data-equip]'))){ toggleEquip(el.getAttribute('data-equip')); return; }
    if ((el=e.target.closest('[data-do]'))){
      var id=+el.getAttribute('data-id');
      ({start:startCase,proc:procComplete,move:moveToRecovery,discharge:discharge,cancel:cancelCase,compl:toggleComplication}
        [el.getAttribute('data-do')]||function(){})(id);
      return;
    }
  });

  /* Typed resource counts on the setup screen. 'change' fires on blur/Enter, so
     the field keeps focus while you type and only re-renders once you're done. */
  $('manual').addEventListener('change', function(e){
    var el=e.target.closest('[data-setnum]'); if (!el) return;
    var k=el.getAttribute('data-setnum'), lo=(k==='rooms'||k==='cases')?1:0;
    var v=parseInt(el.value,10); if (isNaN(v)) v=lo;
    FORM[k]=Math.max(lo, v); renderBody();
  });

  /* Speed dial — live, without rebuilding the player (so the drag survives). */
  $('manual').addEventListener('input', function(e){
    if (!e.target.closest('#speed')) return;
    STEP=Math.max(1, +e.target.value||1);
    var sv=$('sval'); if (sv) sv.textContent=speedLabel();
  });

  /* ---- scrubber drag (YouTube-style seek) ---- */
  var seeking=false;
  function seekFromEvent(e){
    var tr=$('seek'); if (!tr) return;
    var r=tr.getBoundingClientRect(), f=clamp((e.clientX-r.left)/r.width, 0, 1);
    seek(DAY0 + f*(HARD-DAY0));
  }
  document.addEventListener('pointerdown', function(e){
    if (!M || !e.target.closest('#seek')) return;
    seeking=true; stopAuto(); seekFromEvent(e); e.preventDefault();
  });
  document.addEventListener('pointermove', function(e){ if (seeking) seekFromEvent(e); });
  document.addEventListener('pointerup', function(){ if (seeking){ seeking=false; renderBody(); } });

  renderAll();
})();
</script>
</body>
</html>
