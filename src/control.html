<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EP Lab Tycoon — control panel</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css">
<style>
  :root{
    --ep-font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --ep-page:#eceae3; --ep-card:#ffffff; --ep-soft:#f5f4ef; --ep-inset:#f0eee7;
    --ep-line:rgba(20,20,18,.12); --ep-line2:rgba(20,20,18,.24);
    --ep-text:#2b2b27; --ep-text2:#5f5e58; --ep-text3:#8a8980;
    --ep-accent:#0f6e56; --ep-accent-bg:#e1f5ee; --ep-accent-line:#5dcaa5;
    --ep-good:#3b6d11; --ep-good-bg:#eaf3de;
    --ep-warn:#8a5206; --ep-warn-bg:#faeeda;
    --ep-bad:#a32d2d; --ep-bad-bg:#fcebeb;
    --ep-blue:#185fa5; --ep-blue-bg:#e6f1fb;
    --s-proc:#185fa5; --s-setup:#85b7eb; --s-turn:#b4b2a9;
    --s-block:#a32d2d; --s-down:#8a5206; --s-idle:#e8e6df;
    --r:10px;
  }
  @media (prefers-color-scheme:dark){:root{
    --ep-page:#191918; --ep-card:#242422; --ep-soft:#201f1d; --ep-inset:#1c1c1a;
    --ep-line:rgba(255,255,255,.13); --ep-line2:rgba(255,255,255,.26);
    --ep-text:#f1efe8; --ep-text2:#b7b5ab; --ep-text3:#8a8980;
    --ep-accent:#5dcaa5; --ep-accent-bg:#0d3a30; --ep-accent-line:#0f6e56;
    --ep-good:#97c459; --ep-good-bg:#213b08;
    --ep-warn:#efb44a; --ep-warn-bg:#3a2606;
    --ep-bad:#f09595; --ep-bad-bg:#3f1414;
    --ep-blue:#85b7eb; --ep-blue-bg:#0c2a45;
    --s-proc:#378add; --s-setup:#185fa5; --s-turn:#5f5e5a;
    --s-block:#e24b4a; --s-down:#ba7517; --s-idle:#2f2f2c;
  }}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--ep-page);color:var(--ep-text);font-family:var(--ep-font);
       -webkit-font-smoothing:antialiased;padding:20px 12px;line-height:1.5}
  .ept{max-width:940px;margin:0 auto}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
  .frame{background:var(--ep-card);border:0.5px solid var(--ep-line);border-radius:16px;overflow:hidden}
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px;
       border-bottom:0.5px solid var(--ep-line);background:var(--ep-soft);flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:10px;font-weight:500;font-size:17px}
  .logo{width:30px;height:30px;border-radius:8px;background:var(--ep-accent-bg);color:var(--ep-accent);
        display:flex;align-items:center;justify-content:center;font-size:18px}
  .tabs{display:flex;gap:4px}
  .tab{font:inherit;font-size:13px;font-weight:500;padding:6px 13px;border-radius:999px;cursor:pointer;
       border:0.5px solid var(--ep-line2);background:var(--ep-card);color:var(--ep-text2);display:inline-flex;align-items:center;gap:6px}
  .tab.on{background:var(--ep-accent-bg);border-color:var(--ep-accent);color:var(--ep-accent)}

  .clockbar{display:flex;align-items:center;gap:10px;padding:10px 18px;border-bottom:0.5px solid var(--ep-line);
            background:var(--ep-card);flex-wrap:wrap}
  .clockface{font-size:22px;font-weight:500;font-variant-numeric:tabular-nums;min-width:104px}
  .clockface.late{color:var(--ep-warn)}
  .tadv{display:flex;gap:5px;flex-wrap:wrap}
  .tbtn{font:inherit;font-size:12.5px;font-weight:500;padding:5px 11px;border-radius:999px;cursor:pointer;
        border:0.5px solid var(--ep-line2);background:var(--ep-card);color:var(--ep-text2)}
  .tbtn:hover{border-color:var(--ep-accent);color:var(--ep-accent)}
  .tbtn.on{background:var(--ep-accent-bg);border-color:var(--ep-accent);color:var(--ep-accent)}
  .grow{flex:1}

  .hud{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px;padding:14px 18px 4px}
  .met{background:var(--ep-soft);border-radius:var(--r);padding:9px 11px}
  .met .k{font-size:11.5px;color:var(--ep-text2);display:flex;align-items:center;gap:5px}
  .met .v{font-size:21px;font-weight:500;margin-top:2px;line-height:1.1}
  .met .u{font-size:12px;color:var(--ep-text3);font-weight:400}
  .v.good{color:var(--ep-good)} .v.warn{color:var(--ep-warn)} .v.bad{color:var(--ep-bad)}

  .cols{display:grid;grid-template-columns:1fr;gap:0}
  @media(min-width:760px){.cols{grid-template-columns:288px 1fr}}
  .panel{padding:14px 18px;border-top:0.5px solid var(--ep-line)}
  @media(min-width:760px){.panel.left{border-right:0.5px solid var(--ep-line)}}
  .plab{font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;
        color:var(--ep-text3);margin:0 0 10px;display:flex;align-items:center;gap:6px}
  .plab .sub{letter-spacing:0;text-transform:none;font-weight:400;color:var(--ep-text3);margin-left:auto;font-size:11px}

  .res{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0;border-top:0.5px solid var(--ep-line)}
  .res:first-of-type{border-top:0}
  .res .rl{font-size:13.5px;display:flex;align-items:center;gap:7px}
  .res .rl i{color:var(--ep-text2);font-size:16px;width:18px;text-align:center}
  .res .rl .rhint{font-size:11.5px;color:var(--ep-text3)}
  .stepper{display:flex;align-items:center;gap:2px}
  .stepper button{font:inherit;width:26px;height:26px;border-radius:7px;cursor:pointer;
        border:0.5px solid var(--ep-line2);background:var(--ep-card);color:var(--ep-text);font-size:15px;line-height:1}
  .stepper button:hover{border-color:var(--ep-accent);color:var(--ep-accent)}
  .stepper button:disabled{opacity:.35;cursor:not-allowed}
  .stepper .val{min-width:26px;text-align:center;font-size:15px;font-weight:500;font-variant-numeric:tabular-nums}
  .toggle{font:inherit;font-size:12px;font-weight:500;padding:4px 11px;border-radius:999px;cursor:pointer;
          border:0.5px solid var(--ep-line2);background:var(--ep-good-bg);color:var(--ep-good);min-width:74px}
  .toggle.down{background:var(--ep-bad-bg);color:var(--ep-bad)}
  .rooms{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
  .rchip{font:inherit;font-size:12px;font-weight:500;padding:5px 10px;border-radius:8px;cursor:pointer;
         border:0.5px solid var(--ep-line2);background:var(--ep-good-bg);color:var(--ep-good);display:inline-flex;align-items:center;gap:5px}
  .rchip.closed{background:var(--ep-inset);color:var(--ep-text3)}
  .rchip.busy{background:var(--ep-blue-bg);color:var(--ep-blue);cursor:default}
  .rchip.dwn{background:var(--ep-bad-bg);color:var(--ep-bad)}

  .cases{padding:14px 18px}
  .cgrp{margin-bottom:14px}
  .cgrp:last-child{margin-bottom:0}
  .case{display:flex;align-items:center;gap:11px;padding:9px 11px;border:0.5px solid var(--ep-line);
        border-radius:12px;margin-bottom:7px;background:var(--ep-card)}
  .case.blocked{border-color:var(--ep-bad);background:var(--ep-bad-bg)}
  .case.recovery{background:var(--ep-accent-bg);border-color:var(--ep-accent-line)}
  .case.done{opacity:.55}
  .cdot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--s-idle)}
  .cdot.procedure{background:var(--s-proc)} .cdot.blocked{background:var(--s-block)}
  .cdot.recovery{background:var(--ep-accent)} .cdot.discharged{background:var(--ep-good)}
  .cdot.cancelled{background:var(--ep-text3)}
  .cmain{flex:1;min-width:0}
  .cname{font-size:14px;font-weight:500;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .badge{font-size:10.5px;font-weight:500;padding:1px 7px;border-radius:999px;background:var(--ep-inset);color:var(--ep-text2)}
  .badge.inp{background:var(--ep-blue-bg);color:var(--ep-blue)}
  .badge.compl{background:var(--ep-bad-bg);color:var(--ep-bad)}
  .csub{font-size:12px;color:var(--ep-text3);margin-top:1px}
  .cact{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .mini{font:inherit;font-size:12.5px;font-weight:500;padding:6px 11px;border-radius:9px;cursor:pointer;
        border:0.5px solid var(--ep-line2);background:var(--ep-card);color:var(--ep-text);display:inline-flex;align-items:center;gap:5px}
  .mini:hover:not(:disabled){border-color:var(--ep-accent);color:var(--ep-accent)}
  .mini.primary{background:var(--ep-accent);border-color:var(--ep-accent);color:#fff}
  @media (prefers-color-scheme:dark){.mini.primary{color:#04241c}}
  .mini.warn{color:var(--ep-warn)} .mini.warn:hover:not(:disabled){border-color:var(--ep-warn)}
  .mini.ghost{color:var(--ep-text3);font-size:11.5px;padding:4px 8px}
  .mini:disabled{opacity:.4;cursor:not-allowed}
  .why{font-size:11px;color:var(--ep-text3);text-align:right;max-width:150px}

  .feed{padding:2px 18px 14px}
  .fitem{display:flex;gap:9px;font-size:13px;color:var(--ep-text2);padding:3px 0;animation:slide .25s ease-out}
  @keyframes slide{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
  .fitem .ft{font-variant-numeric:tabular-nums;color:var(--ep-text3);flex:none;width:64px}
  .fitem.block{color:var(--ep-bad)} .fitem.discharge{color:var(--ep-good)}
  .fitem.complication{color:var(--ep-bad);font-weight:500} .fitem.cancel{color:var(--ep-warn)}

  .setup{padding:20px 18px}
  .setrow{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:9px 0;border-top:0.5px solid var(--ep-line)}
  .setrow:first-of-type{border-top:0}
  .setrow .sl{font-size:14px;display:flex;align-items:center;gap:8px}
  .setrow .sl i{color:var(--ep-accent);font-size:17px;width:20px;text-align:center}
  .prio{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0 4px}
  .pchip{font:inherit;font-size:12.5px;font-weight:500;padding:6px 13px;border-radius:999px;cursor:pointer;
         border:0.5px solid var(--ep-line2);background:var(--ep-card);color:var(--ep-text2)}
  .pchip.on{background:var(--ep-accent-bg);border-color:var(--ep-accent);color:var(--ep-accent)}
  .note{font-size:12.5px;color:var(--ep-text3);margin:4px 0 0}

  .act{display:flex;justify-content:center;gap:9px;padding:6px 18px 18px;flex-wrap:wrap}
  .btn{font:inherit;font-size:14px;font-weight:500;border-radius:var(--r);padding:9px 16px;cursor:pointer;
       border:0.5px solid var(--ep-line2);background:var(--ep-card);color:var(--ep-text);
       display:inline-flex;align-items:center;gap:7px;text-decoration:none}
  .btn:hover{background:var(--ep-soft)}
  .btn.primary{background:var(--ep-accent);border-color:var(--ep-accent);color:#fff}
  @media (prefers-color-scheme:dark){.btn.primary{color:#04241c}}
  .btn.big{font-size:16px;padding:12px 24px;border-radius:12px}

  .stars{font-size:26px;color:var(--ep-line2);display:flex;gap:3px;justify-content:center;margin:2px 0 4px}
  .stars i.on{color:var(--ep-warn)}
  .verdict{text-align:center;font-size:16px;font-weight:500;margin:0 0 12px}
  .center{text-align:center;font-size:13.5px;color:var(--ep-text2);margin:0 0 8px}
  .center b{color:var(--ep-text)}
  .rolls{background:var(--ep-bad-bg);border-radius:12px;padding:11px 13px;margin:12px 18px;font-size:13.5px}
  .rolls .rt{font-weight:500;color:var(--ep-text);margin-bottom:5px}
  .rolls ul{margin:0;padding-left:17px;color:var(--ep-text2)}
  .sh{font-size:20px;font-weight:500;margin:5px 0 6px;text-align:center}
  .stime{font-size:12px;font-weight:500;letter-spacing:.03em;text-transform:uppercase;
         color:var(--ep-accent);display:flex;align-items:center;gap:7px;justify-content:center;padding-top:16px}

  #scripted{width:100%;border:0;display:block;min-height:900px}
  .hide{display:none !important}
</style>
</head>
<body>
<div class="ept">
<h2 class="sr">EP Lab Tycoon control panel: run a day in an electrophysiology lab by hand. Edit staff, room, bed and equipment availability at any time, and advance each case through its steps yourself. A scripted-day mode is also available.</h2>
<div class="frame">
  <div class="top">
    <div class="brand"><span class="logo" aria-hidden="true"><i class="ti ti-heartbeat"></i></span> EP Lab Tycoon</div>
    <div class="tabs">
      <button class="tab on" id="tab-manual" data-mode="manual"><i class="ti ti-adjustments" aria-hidden="true"></i> Manual control</button>
      <button class="tab" id="tab-scripted" data-mode="scripted"><i class="ti ti-cards" aria-hidden="true"></i> Scripted day</button>
    </div>
  </div>

  <!-- ============ MANUAL MODE ============ -->
  <div id="manual">
    <div id="clockwrap"></div>
    <div id="hud"></div>
    <div id="body"></div>
  </div>

  <!-- ============ SCRIPTED MODE ============ -->
  <iframe id="scripted" class="hide" title="Scripted day"></iframe>
</div>
</div>

<script src="sim.js"></script>
<script>
(function(){
  'use strict';
  var DAY0 = 7*60, SCHED_END = 17*60, HARD = 19*60;
  var CREW = EPSim.CREW_PER_ROOM;                 // {ep:1, nurse:1, tech:2}
  var BPN = EPSim.BEDS_PER_RECOVERY_NURSE;        // 4
  var COSTS = EPSim.COSTS, CT = EPSim.CASE_TYPES;

  // Live manual-mode state. Null until the lab is opened.
  var M = null;
  // Setup form defaults (mirror play.html's supported day).
  var FORM = {cases:6, rooms:2, phys:2, nurses:5, techs:4, beds:4, ward:2, seed:20260727, profile:'balanced'};
  var autoTimer = null;

  function $(id){ return document.getElementById(id); }
  function hhmm(m){ return EPSim.hhmm(m); }

  /* ----------------------------------------------------------------------
     MODE SWITCH
     ---------------------------------------------------------------------- */
  document.querySelector('.tabs').addEventListener('click', function(e){
    var t = e.target.closest('.tab'); if (!t) return;
    setMode(t.getAttribute('data-mode'));
  });
  function setMode(mode){
    var manual = mode === 'manual';
    $('tab-manual').classList.toggle('on', manual);
    $('tab-scripted').classList.toggle('on', !manual);
    $('manual').classList.toggle('hide', !manual);
    $('scripted').classList.toggle('hide', manual);
    if (!manual && !$('scripted').getAttribute('src')) $('scripted').setAttribute('src','play.html');
    if (manual && autoTimer) stopAuto();
  }

  /* ----------------------------------------------------------------------
     ROSTER — reuse the sim's patient generator so names, case types and
     waiting times are the same believable people the scripted day uses.
     ---------------------------------------------------------------------- */
  function buildRoster(cfg, seed){
    var r = EPSim.runDay({config:cfg, seed:seed, policy:EPSim.replay([])});
    return r.patients.map(function(p){
      return { id:p.id, name:p.name, type:p.type, typeLabel:p.typeLabel,
        planned:p.planned, recoveryMin:p.recoveryMin, inpatient:p.inpatient,
        daysWaiting:p.daysWaiting, acuity:p.acuity, complication:false,
        status:'booked', room:null,
        startedAt:null, procDoneAt:null, recoveredAt:null, dischargedAt:null, cancelReason:null };
    });
  }

  function openLab(){
    var cfg = {cases:FORM.cases, rooms:FORM.rooms, phys:FORM.phys, nurses:FORM.nurses, techs:FORM.techs, beds:FORM.beds};
    M = {
      clock: DAY0, cfg: cfg, seed: FORM.seed, profile: FORM.profile,
      // live availability — every one of these is editable at any moment
      avail: { ep:FORM.phys, nurse:FORM.nurses, tech:FORM.techs },
      staffPlanned: { ep:FORM.phys, nurse:FORM.nurses, tech:FORM.techs },
      rooms: [], bedsTotal:FORM.beds, wardFree:FORM.ward,
      equip: { mapping:true, imaging:true, supply:true },
      cases: buildRoster(cfg, FORM.seed),
      feed: [], charges: 0, missedBreaks: 0,
    };
    for (var i=0;i<FORM.rooms;i++) M.rooms.push({ id:i, label:'EP lab '+(i+1), open:true });
    log('The lab opens for the day.', '');
    renderAll();
  }

  function log(text, kind){ M.feed.push({ t:M.clock, text:text, kind:kind||'' }); }

  /* ----------------------------------------------------------------------
     RESOURCE ACCOUNTING — who and what is committed right now
     ---------------------------------------------------------------------- */
  function procCases(){ return M.cases.filter(function(c){ return c.status==='procedure'; }); }
  function roomOccupied(){                             // rooms physically tied up (in-case OR blocked)
    var s={}; M.cases.forEach(function(c){ if ((c.status==='procedure'||c.status==='blocked') && c.room!=null) s[c.room]=1; });
    return s;
  }
  function recoveryOccupied(){ return M.cases.filter(function(c){ return c.status==='recovery'; }).length; }
  function recoveryNursesNeeded(){ return Math.ceil(recoveryOccupied()/BPN); }
  function nursesInRooms(){ return procCases().length; }   // one nurse per running room
  function usableBeds(){
    var recNurses = Math.max(0, M.avail.nurse - nursesInRooms());
    return Math.min(M.bedsTotal, recNurses*BPN);
  }
  function freeBeds(){ return Math.max(0, usableBeds() - recoveryOccupied()); }
  function freeRoom(){
    var occ = roomOccupied();
    for (var i=0;i<M.rooms.length;i++) if (M.rooms[i].open && !occ[M.rooms[i].id]) return M.rooms[i];
    return null;
  }

  /* Can this booked case start right now? Returns a reason string if not. */
  function startBlock(c){
    if (!freeRoom()) return 'no open room free';
    if (!M.equip.mapping) return 'mapping system down';
    if (!M.equip.imaging) return 'imaging down';
    if (c.type==='af' && !M.equip.supply) return 'no ablation catheters';
    var np = nursesInRooms()+1, needNurse = np + recoveryNursesNeeded();
    if (np > M.avail.ep) return 'no EP physician free';
    if (needNurse > M.avail.nurse) return 'no nurse free (recovery needs cover)';
    if (np*CREW.tech > M.avail.tech) return 'not enough techs free';
    return null;
  }

  /* ----------------------------------------------------------------------
     CASE STEP ACTIONS
     ---------------------------------------------------------------------- */
  function startCase(id){
    var c = byId(id); if (!c || c.status!=='booked') return;
    if (startBlock(c)) return;
    var room = freeRoom();
    c.status='procedure'; c.room=room.id; c.startedAt=M.clock;
    log(c.name+' — '+c.typeLabel+' started in '+room.label, 'start');
    renderAll();
  }
  function procComplete(id){
    var c = byId(id); if (!c || c.status!=='procedure') return;
    c.procDoneAt = M.clock;
    if (freeBeds()>0){
      c.status='recovery'; c.recoveredAt=M.clock; c.room=null;
      log(c.name+' out of the room, into recovery', '');
    } else {
      c.status='blocked';   // patient can't leave — room stays tied up
      log(roomLabel(c.room)+' blocked — no recovery bed for '+c.name, 'block');
    }
    renderAll();
  }
  function moveToRecovery(id){
    var c = byId(id); if (!c || c.status!=='blocked') return;
    if (freeBeds()<=0) return;
    c.status='recovery'; c.recoveredAt=M.clock; c.room=null;
    log(c.name+' finally moved to recovery', 'discharge');
    renderAll();
  }
  function discharge(id){
    var c = byId(id); if (!c || c.status!=='recovery') return;
    if (c.inpatient && M.wardFree<=0) return;
    if (c.inpatient) M.wardFree--;
    c.status='discharged'; c.dischargedAt=M.clock;
    log(c.name+' discharged from recovery', 'discharge');
    renderAll();
  }
  function cancelCase(id){
    var c = byId(id); if (!c || c.status!=='booked') return;
    c.status='cancelled'; c.cancelReason='cancelled by you';
    log(c.name+' — '+c.typeLabel+' cancelled', 'cancel');
    renderAll();
  }
  function toggleComplication(id){
    var c = byId(id);
    if (!c || (c.status==='booked'||c.status==='cancelled')) return;
    c.complication = !c.complication;
    log(c.name+(c.complication?' — complication flagged':' — complication cleared'), c.complication?'complication':'');
    renderAll();
  }

  function byId(id){ for (var i=0;i<M.cases.length;i++) if (M.cases[i].id===id) return M.cases[i]; return null; }
  function roomLabel(id){ var r=M.rooms[id]; return r?r.label:'a room'; }

  /* ----------------------------------------------------------------------
     LIVE RESOURCE EDITS
     ---------------------------------------------------------------------- */
  function bumpStaff(role, d){
    var v = M.avail[role]+d;
    if (v<0) v=0; if (v>20) v=20;
    M.avail[role]=v;
    log((d>0?'Extra ':'One fewer ')+roleName(role)+' available now ('+v+')', '');
    renderAll();
  }
  function bumpBeds(d){
    var v = M.bedsTotal+d; if (v<0) v=0; if (v>20) v=20;
    M.bedsTotal=v; log('Recovery beds set to '+v, ''); renderAll();
  }
  function bumpWard(d){
    var v = M.wardFree+d; if (v<0) v=0; if (v>20) v=20;
    M.wardFree=v; log('Ward beds free set to '+v, ''); renderAll();
  }
  function toggleRoom(id){
    var r=M.rooms[id]; if (!r) return;
    if (roomOccupied()[id]) return;                 // can't close a room with a patient in it
    r.open=!r.open; log(r.label+(r.open?' opened':' closed'), ''); renderAll();
  }
  function toggleEquip(key){
    M.equip[key]=!M.equip[key];
    var name={mapping:'3D mapping system',imaging:'Fluoroscopy / imaging',supply:'Ablation catheter stock'}[key];
    log(name+(M.equip[key]?' back available':' marked unavailable'), M.equip[key]?'':'block');
    renderAll();
  }
  function roleName(r){ return {ep:'EP physician',nurse:'nurse',tech:'tech'}[r]; }

  /* ----------------------------------------------------------------------
     CLOCK
     ---------------------------------------------------------------------- */
  function advance(mins){
    M.clock = Math.min(HARD, M.clock+mins);
    // A crude missed-break proxy: crossing a 4-hour boundary with rooms running.
    renderAll();
    if (M.clock>=HARD) stopAuto();
  }
  function startAuto(){
    if (autoTimer) return;
    autoTimer = setInterval(function(){ advance(10); }, 450);
    renderClock();
  }
  function stopAuto(){ if (autoTimer){ clearInterval(autoTimer); autoTimer=null; } renderClock(); }

  /* ----------------------------------------------------------------------
     LIVE METRICS
     ---------------------------------------------------------------------- */
  function liveMetrics(){
    var done = M.cases.filter(function(c){ return c.status==='discharged'; });
    var cancelled = M.cases.filter(function(c){ return c.status==='cancelled'; });
    var inflight = M.cases.filter(function(c){ return c.status==='procedure'||c.status==='blocked'||c.status==='recovery'; });
    var booked = M.cases.filter(function(c){ return c.status==='booked'; });
    var compl = M.cases.filter(function(c){ return c.complication; }).length;

    var heads = M.staffPlanned.ep + M.staffPlanned.nurse + M.staffPlanned.tech;
    var otPerHead = Math.max(0, M.clock - SCHED_END);
    var overtimeMinutes = otPerHead * heads;

    // rough live cost from the clock
    var regMin = Math.max(0, Math.min(M.clock,SCHED_END)-DAY0)/60;
    var otMin = Math.max(0, M.clock-SCHED_END)/60;
    var staffCost = 0;
    ['ep','nurse','tech'].forEach(function(role){
      var rate = COSTS.hourly[role]||0, n = M.staffPlanned[role];
      staffCost += n*(regMin*rate + otMin*rate*COSTS.overtimeMultiplier);
    });
    var roomOpenMin = M.rooms.filter(function(r){return r.open;}).length * Math.max(0,M.clock-DAY0);
    var roomCost = roomOpenMin/60*COSTS.roomHour;
    var supplyCost = done.reduce(function(a,c){ return a+CT[c.type].supply; },0);
    var funding = done.reduce(function(a,c){ return a+CT[c.type].funding; },0);
    var total = staffCost + roomCost + supplyCost + M.charges;

    return {
      done:done, cancelled:cancelled, inflight:inflight, booked:booked, compl:compl,
      heads:heads, overtimeMinutes:overtimeMinutes, otPerHead:otPerHead,
      totalCost:Math.round(total), funding:Math.round(funding),
      margin:Math.round(funding-total),
      costPerCase: done.length ? Math.round(total/done.length) : Math.round(total)
    };
  }

  /* Assemble a sim-shaped metrics object so we can reuse EPSim scoring. */
  function scoreMetrics(){
    var lm = liveMetrics();
    var completed = lm.done.length, cancelledN = lm.cancelled.length;
    var booked = M.cases.length;                    // manual mode has no add-ons
    var worked = Math.max(0, M.clock-DAY0);
    var maxFatigue = clamp(worked/600*0.30 + lm.otPerHead/180*0.40, 0, 1);
    var deferredHarm = booked ? clamp(cancelledN/booked *
        (cancelledN ? avg(lm.cancelled.map(function(c){ return clamp(c.daysWaiting/365,0,1); })) : 0), 0, 1) : 0;
    var m = {
      booked:booked, addOns:0, completed:completed, cancelled:cancelledN,
      complicationRate: completed ? lm.compl/completed : 0,
      maxFatigue: Math.round(maxFatigue*100)/100,
      deferredHarm: deferredHarm,
      staffCount: lm.heads, overtimeMinutes: lm.overtimeMinutes, missedBreaks: M.missedBreaks,
      costPerCase: lm.costPerCase
    };
    m.kpis = EPSim.kpis(m);
    return m;
  }
  function clamp(v,lo,hi){ return Math.max(lo,Math.min(hi,v)); }
  function avg(a){ return a.length ? a.reduce(function(x,y){return x+y;},0)/a.length : 0; }

  /* ----------------------------------------------------------------------
     RENDER
     ---------------------------------------------------------------------- */
  function renderAll(){ renderClock(); renderHUD(); renderBody(); }

  function renderClock(){
    if (!M){ $('clockwrap').innerHTML=''; return; }
    var late = M.clock>SCHED_END;
    $('clockwrap').innerHTML =
      '<div class="clockbar"><span class="clockface'+(late?' late':'')+'">'+hhmm(M.clock)+'</span>'+
      '<div class="tadv">'+
        '<button class="tbtn" data-adv="15">+15m</button>'+
        '<button class="tbtn" data-adv="30">+30m</button>'+
        '<button class="tbtn" data-adv="60">+1h</button>'+
        '<button class="tbtn'+(autoTimer?' on':'')+'" id="autobtn">'+
          (autoTimer?'<i class="ti ti-player-pause"></i> pause':'<i class="ti ti-player-play"></i> auto')+'</button>'+
      '</div><div class="grow"></div>'+
      '<button class="btn" id="endshift"><i class="ti ti-flag-checkered"></i> End shift</button></div>';
  }

  function renderHUD(){
    if (!M){ $('hud').innerHTML=''; return; }
    var lm = liveMetrics();
    var late = lm.otPerHead;
    $('hud').innerHTML = '<div class="hud">'+
      met('ti-stethoscope','Cases done', lm.done.length+'<span class="u"> / '+M.cases.length+'</span>','') +
      met('ti-activity','In progress', lm.inflight.length, '') +
      met('ti-user-x','Sent away', lm.cancelled.length, lm.cancelled.length===0?'good':lm.cancelled.length<=2?'warn':'bad') +
      met('ti-clock','Past 5pm', late+'<span class="u"> min</span>', late===0?'good':late<=60?'warn':'bad') +
      met('ti-cash','Margin', '$'+lm.margin.toLocaleString(), lm.margin>=0?'good':'bad') +
    '</div>';
  }
  function met(icon,k,v,cls){
    return '<div class="met"><div class="k"><i class="ti '+icon+'" aria-hidden="true"></i>'+k+'</div>'+
           '<div class="v '+cls+'">'+v+'</div></div>';
  }

  function renderBody(){
    if (!M){ $('body').innerHTML = setup(); return; }
    $('body').innerHTML =
      '<div class="cols">'+
        '<div class="panel left">'+resources()+'</div>'+
        '<div class="panel" style="border-top:0.5px solid var(--ep-line)">'+caseBoard()+'</div>'+
      '</div>'+ feed();
  }

  /* ---- setup ---- */
  function setup(){
    return '<div class="setup">'+
      '<p class="plab"><i class="ti ti-settings"></i> Set up the day</p>'+
      setline('ti-stethoscope','Cases booked','cases')+
      setline('ti-door','EP labs (rooms)','rooms')+
      setline('ti-user-heart','EP physicians','phys')+
      setline('ti-nurse','Nurses','nurses')+
      setline('ti-tool','Techs','techs')+
      setline('ti-bed','Recovery beds','beds')+
      setline('ti-building-hospital','Ward beds free','ward')+
      '<p class="plab" style="margin-top:14px"><i class="ti ti-target"></i> Priorities — what counts as a good day</p>'+
      '<div class="prio">'+Object.keys(EPSim.PROFILES).map(function(k){
        return '<button class="pchip'+(k===FORM.profile?' on':'')+'" data-prio="'+k+'">'+EPSim.PROFILES[k].label+'</button>';
      }).join('')+'</div>'+
      '<p class="note">Nothing runs on its own here. You bring each patient into a room, mark the procedure complete, move them to recovery and discharge them — and you can change who and what is available at any moment.</p>'+
      '<div class="act"><button class="btn primary big" id="openlab"><i class="ti ti-lock-open"></i> Open the lab</button></div></div>';
  }
  function setline(icon,label,key){
    return '<div class="setrow"><div class="sl"><i class="ti '+icon+'"></i>'+label+'</div>'+
      '<div class="stepper"><button data-set="'+key+'" data-d="-1">–</button>'+
      '<span class="val" id="set-'+key+'">'+FORM[key]+'</span>'+
      '<button data-set="'+key+'" data-d="1">+</button></div></div>';
  }

  /* ---- live resource panel ---- */
  function resources(){
    var occ = roomOccupied();
    var recBusy = nursesInRooms(), recNurses = Math.max(0, M.avail.nurse-recBusy);
    var h = '<p class="plab"><i class="ti ti-adjustments"></i> Availability <span class="sub">edit anytime</span></p>';
    h += staffRow('ti-user-heart','EP physicians','ep');
    h += staffRow('ti-nurse','Nurses','nurse');
    h += staffRow('ti-tool','Techs','tech');

    h += '<div class="res"><div class="rl"><i class="ti ti-door"></i>Rooms<span class="rhint">'+
         '('+Object.keys(occ).length+' in use)</span></div></div>';
    h += '<div class="rooms">'+M.rooms.map(function(r){
      var busy = occ[r.id];
      var cls = busy ? 'busy' : (r.open ? '' : 'closed');
      return '<button class="rchip '+cls+'" data-room="'+r.id+'"'+(busy?' disabled':'')+'>'+
        '<i class="ti ti-'+(busy?'user':(r.open?'door-enter':'door-off'))+'"></i>'+r.label.replace('EP lab','Lab')+
        (busy?' · in use':(r.open?'':' · closed'))+'</button>';
    }).join('')+'</div>';

    h += '<div class="res" style="margin-top:4px"><div class="rl"><i class="ti ti-bed"></i>Recovery beds'+
         '<span class="rhint">'+recoveryOccupied()+' used · '+usableBeds()+' usable</span></div>'+
         stepper('beds', M.bedsTotal)+'</div>';
    h += '<div class="res"><div class="rl"><i class="ti ti-building-hospital"></i>Ward beds free</div>'+
         stepper('ward', M.wardFree)+'</div>';
    if (recNurses < 1 && recoveryOccupied()>0)
      h += '<p class="note" style="color:var(--ep-bad)">No nurse is watching recovery — beds are unusable until one is free.</p>';

    h += '<p class="plab" style="margin-top:14px"><i class="ti ti-plug"></i> Instruments</p>';
    h += equipRow('ti-topology-star-3','3D mapping system','mapping');
    h += equipRow('ti-scan','Fluoroscopy / imaging','imaging');
    h += equipRow('ti-vaccine','Ablation catheter stock','supply');
    return h;
  }
  function staffRow(icon,label,role){
    return '<div class="res"><div class="rl"><i class="ti '+icon+'"></i>'+label+
      '<span class="rhint">'+M.avail[role]+' of '+M.staffPlanned[role]+'</span></div>'+
      stepper(role, M.avail[role])+'</div>';
  }
  function stepper(key,val){
    return '<div class="stepper"><button data-bump="'+key+'" data-d="-1">–</button>'+
      '<span class="val">'+val+'</span><button data-bump="'+key+'" data-d="1">+</button></div>';
  }
  function equipRow(icon,label,key){
    var up = M.equip[key];
    return '<div class="res"><div class="rl"><i class="ti '+icon+'"></i>'+label+'</div>'+
      '<button class="toggle'+(up?'':' down')+'" data-equip="'+key+'">'+(up?'Available':'Down')+'</button></div>';
  }

  /* ---- case board ---- */
  function caseBoard(){
    var order = ['procedure','blocked','recovery','booked','discharged','cancelled'];
    var groups = {
      procedure:{label:'In a procedure', items:[]},
      blocked:{label:'Waiting for a recovery bed', items:[]},
      recovery:{label:'In recovery', items:[]},
      booked:{label:'Waiting to start', items:[]},
      done:{label:'Finished', items:[]}
    };
    M.cases.forEach(function(c){
      var g = (c.status==='discharged'||c.status==='cancelled') ? 'done' : c.status;
      (groups[g]||groups.done).items.push(c);
    });
    groups.booked.items.sort(function(a,b){ return a.acuity-b.acuity || b.daysWaiting-a.daysWaiting; });

    var h = '<p class="plab"><i class="ti ti-clipboard-list"></i> Cases <span class="sub">advance each one yourself</span></p>';
    ['procedure','blocked','recovery','booked','done'].forEach(function(g){
      var grp = groups[g];
      if (!grp.items.length) return;
      h += '<div class="cgrp"><p class="plab" style="margin:0 0 6px;color:var(--ep-text3)">'+grp.label+' · '+grp.items.length+'</p>';
      h += grp.items.map(caseRow).join('');
      h += '</div>';
    });
    return h;
  }
  function caseRow(c){
    var cls = c.status==='blocked'?' blocked':c.status==='recovery'?' recovery':
              (c.status==='discharged'||c.status==='cancelled')?' done':'';
    var badges = '';
    if (c.inpatient && c.status!=='discharged' && c.status!=='cancelled') badges += '<span class="badge inp">inpatient</span>';
    if (c.complication) badges += '<span class="badge compl">complication</span>';

    var sub, act='';
    if (c.status==='booked'){
      var reason = startBlock(c);
      sub = 'waiting '+c.daysWaiting+' d · '+c.planned+' min booked';
      act = '<button class="mini primary" data-do="start" data-id="'+c.id+'"'+(reason?' disabled':'')+'>'+
            '<i class="ti ti-player-play"></i> Start</button>'+
            '<button class="mini warn" data-do="cancel" data-id="'+c.id+'"><i class="ti ti-x"></i> Cancel</button>'+
            (reason?'<span class="why">'+reason+'</span>':'');
    } else if (c.status==='procedure'){
      sub = 'in '+roomLabel(c.room)+' · started '+hhmm(c.startedAt);
      act = complBtn(c)+'<button class="mini primary" data-do="proc" data-id="'+c.id+'">'+
            '<i class="ti ti-check"></i> Procedure complete</button>';
    } else if (c.status==='blocked'){
      var noBed = freeBeds()<=0;
      sub = 'procedure done '+hhmm(c.procDoneAt)+' · holding '+roomLabel(c.room);
      act = complBtn(c)+'<button class="mini primary" data-do="move" data-id="'+c.id+'"'+(noBed?' disabled':'')+'>'+
            '<i class="ti ti-bed"></i> Move to recovery</button>'+(noBed?'<span class="why">no bed free</span>':'');
    } else if (c.status==='recovery'){
      var wardBlock = c.inpatient && M.wardFree<=0;
      sub = 'recovering since '+hhmm(c.recoveredAt);
      act = complBtn(c)+'<button class="mini primary" data-do="discharge" data-id="'+c.id+'"'+(wardBlock?' disabled':'')+'>'+
            '<i class="ti ti-logout"></i> Discharge</button>'+(wardBlock?'<span class="why">ward full</span>':'');
    } else if (c.status==='discharged'){
      sub = 'discharged '+hhmm(c.dischargedAt);
    } else {
      sub = c.cancelReason||'cancelled';
    }

    return '<div class="case'+cls+'"><span class="cdot '+c.status+'"></span>'+
      '<div class="cmain"><div class="cname">'+c.name+' '+badges+'</div>'+
      '<div class="csub">'+c.typeLabel+' · '+sub+'</div></div>'+
      '<div class="cact">'+act+'</div></div>';
  }
  function complBtn(c){
    return '<button class="mini ghost" data-do="compl" data-id="'+c.id+'" title="Flag a complication">'+
      '<i class="ti ti-alert-triangle"></i>'+(c.complication?' clear':'')+'</button>';
  }

  /* ---- feed ---- */
  function feed(){
    var evs = M.feed.slice(-8).reverse();
    return '<div class="feed"><p class="plab"><i class="ti ti-list"></i> Activity</p>'+
      (evs.length ? evs.map(function(e){
        return '<div class="fitem '+e.kind+'"><span class="ft">'+hhmm(e.t)+'</span><span>'+e.text+'</span></div>';
      }).join('') : '<div class="fitem"><span class="ft"></span><span style="color:var(--ep-text3)">Nothing yet.</span></div>')+'</div>';
  }

  /* ----------------------------------------------------------------------
     REPORT
     ---------------------------------------------------------------------- */
  function endShift(){
    stopAuto();
    var m = scoreMetrics(), w = EPSim.PROFILES[M.profile].w;
    var sc = EPSim.score(m, w);
    var stars = sc>=0.80?5:sc>=0.64?4:sc>=0.46?3:sc>=0.28?2:1;
    var verd = ['Rough day. The review below shows where it went.',
                'Several trades went the wrong way today.',
                'A middle-of-the-road line through today.',
                'Sharp calls — near the top of what today allowed.',
                'You played today about as well as it could be played.'][stars-1];
    var st=''; for (var i=0;i<5;i++) st+='<i class="ti ti-star'+(i<stars?' on':'')+'"></i>';
    var lm = liveMetrics();

    var rolled = M.cases.filter(function(c){ return c.status!=='discharged'; })
      .sort(function(a,b){ return b.daysWaiting-a.daysWaiting; });
    var rollHtml = rolled.length ? '<div class="rolls"><div class="rt">Not discharged today — rolls to tomorrow</div><ul>'+
      rolled.map(function(c){ return '<li>'+c.name+' — '+c.typeLabel+', waiting '+c.daysWaiting+' days · '+
        (c.status==='cancelled'?c.cancelReason:'left '+c.status)+'</li>'; }).join('')+'</ul></div>' : '';

    $('hud').innerHTML=''; $('clockwrap').innerHTML='';
    $('body').innerHTML =
      '<div class="stime"><i class="ti ti-clipboard-check"></i>'+hhmm(M.clock)+' · end of shift</div>'+
      '<div class="sh">Shift report</div>'+
      '<div class="stars">'+st+'</div><p class="verdict">'+verd+'</p>'+
      '<p class="center">Scored under <b>'+EPSim.PROFILES[M.profile].label+'</b></p>'+
      '<p class="center"><b>'+m.completed+' of '+m.booked+'</b> cases done · '+
        lm.cancelled.length+' sent away · '+m.overtimeMinutes+' min overtime · '+
        lm.compl+' complications · $'+lm.costPerCase.toLocaleString()+' a case</p>'+
      '<p class="center">safety '+pct(m.kpis.safety)+' · throughput '+pct(m.kpis.through)+
        ' · staff '+pct(m.kpis.staff)+' · cost '+pct(m.kpis.cost)+'</p>'+
      rollHtml+
      '<div class="act"><button class="btn primary" id="again"><i class="ti ti-refresh"></i> Run another day</button>'+
      '<a class="btn" href="dashboard.html"><i class="ti ti-chart-bar"></i> Where the day went</a></div>';
  }
  function pct(v){ return Math.round(v*100)+'%'; }

  /* ----------------------------------------------------------------------
     INPUT
     ---------------------------------------------------------------------- */
  $('manual').addEventListener('click', function(e){
    var el;
    if ((el=e.target.closest('[data-set]'))){
      var k=el.getAttribute('data-set'), d=+el.getAttribute('data-d');
      var lo = k==='rooms'||k==='cases'?1:0;
      FORM[k]=Math.max(lo, Math.min(k==='cases'?24:12, FORM[k]+d));
      $('set-'+k).textContent=FORM[k]; return;
    }
    if ((el=e.target.closest('[data-prio]'))){ FORM.profile=el.getAttribute('data-prio'); renderBody(); return; }
    if (e.target.closest('#openlab')){ openLab(); return; }

    if ((el=e.target.closest('[data-adv]'))){ advance(+el.getAttribute('data-adv')); return; }
    if (e.target.closest('#autobtn')){ autoTimer?stopAuto():startAuto(); return; }
    if (e.target.closest('#endshift')){ endShift(); return; }
    if (e.target.closest('#again')){ M=null; stopAuto(); renderAll(); return; }

    if ((el=e.target.closest('[data-bump]'))){
      var key=el.getAttribute('data-bump'), dd=+el.getAttribute('data-d');
      if (key==='beds') bumpBeds(dd);
      else if (key==='ward') bumpWard(dd);
      else bumpStaff(key, dd);
      return;
    }
    if ((el=e.target.closest('[data-room]'))){ toggleRoom(+el.getAttribute('data-room')); return; }
    if ((el=e.target.closest('[data-equip]'))){ toggleEquip(el.getAttribute('data-equip')); return; }

    if ((el=e.target.closest('[data-do]'))){
      var id=+el.getAttribute('data-id'), act=el.getAttribute('data-do');
      ({start:startCase,proc:procComplete,move:moveToRecovery,discharge:discharge,
        cancel:cancelCase,compl:toggleComplication}[act]||function(){})(id);
      return;
    }
  });

  renderAll();
})();
</script>
</body>
